.bigc p{font-size:12.5px;color:var(--ink2);line-height:1.45}

.ib{position:relative;flex:none;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--edge);background:var(--surf);color:var(--ink2);font-size:12px;font-weight:700;transition:transform .12s,color .2s,border-color .2s}
.ib:hover{color:var(--ink);border-color:var(--edge2)}

.ib.on{border-color:rgba(92,191,120,.5);color:var(--ok)}
.ib .pip{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--blood);color:#fff;font:800 10px/17px var(--mono);text-align:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 2.4s infinite}
.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn);animation:blink 1.1s infinite}
.dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad);animation:blink .7s infinite}
.clock{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;border:1px solid var(--edge);background:linear-gradient(120deg,var(--surf2),var(--surf))}
.clock.low{border-color:rgba(214,65,77,.6);background:linear-gradient(120deg,rgba(214,65,77,.14),var(--surf))}
.clock .digits{font:800 26px/1 var(--mono);color:var(--amber)}

.clock .lbl{font:9px/1.3 var(--mono);letter-spacing:.17em;color:var(--ink3);text-transform:uppercase}
.track{height:6px;border-radius:3px;background:var(--void);overflow:hidden;border:1px solid var(--edge)}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--rust),var(--amber));transition:width .6s}
.clock.low .track i{background:linear-gradient(90deg,#8d1f27,var(--blood))}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;padding:13px 18px;border-radius:13px;font-size:15px;font-weight:700;border:1px solid transparent;transition:transform .12s,filter .2s;user-select:none}

.btn:disabled{opacity:.38;pointer-events:none}
.btn-a{background:linear-gradient(135deg,var(--amber),var(--rust));color:#231603;box-shadow:0 8px 26px rgba(223,162,60,.2)}

.btn-g{background:var(--surf);border-color:var(--edge);color:var(--ink)}
.btn-g:hover{border-color:var(--edge2)}
.btn-b{background:rgba(214,65,77,.1);border-color:rgba(214,65,77,.5);color:var(--blood2)}
.btn-c{background:rgba(60,180,214,.1);border-color:rgba(60,180,214,.5);color:var(--cyan)}
.btn-v{background:rgba(163,119,230,.1);border-color:rgba(163,119,230,.5);color:var(--violet)}
.btn-s{min-height:42px;font-size:13px;padding:9px 13px;width:auto}
.link{color:var(--ink2);font-size:13px;text-decoration:underline;text-underline-offset:3px;align-self:center;padding:7px}
.link:hover{color:var(--amber)}
.card{background:linear-gradient(175deg,var(--surf2),var(--surf));border:1px solid var(--edge);border-radius:16px;padding:15px}
.card.tight{padding:12px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font:10px/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--edge);background:var(--surf);color:var(--ink2);white-space:nowrap}
.tag.a{border-color:rgba(223,162,60,.5);color:var(--amber);background:rgba(223,162,60,.1)}
.tag.b{border-color:rgba(214,65,77,.5);color:var(--blood2);background:rgba(214,65,77,.1)}
.tag.c{border-color:rgba(60,180,214,.5);color:var(--cyan);background:rgba(60,180,214,.1)}
.tag.v{border-color:rgba(163,119,230,.5);color:var(--violet);background:rgba(163,119,230,.1)}
.tag.g{border-color:rgba(92,191,120,.5);color:var(--ok);background:rgba(92,191,120,.1)}
.seal{display:inline-block;font:10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--amber);border:1.5px solid rgba(223,162,60,.6);border-radius:5px;padding:5px 9px;transform:rotate(-2deg)}
.seal.red{color:var(--blood2);border-color:rgba(214,65,77,.6)}
.mut{color:var(--ink2);font-size:13px}
.dim{color:var(--ink3);font-size:12px}
.mono{font-family:var(--mono)}
.ser{font-family:var(--serif)}
.ctr{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:9px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.2}
.spin{width:42px;height:42px;border-radius:50%;border:3px solid var(--edge);border-top-color:var(--amber);animation:spin .9s linear infinite;margin:0 auto}
.dots:after{content:'…';animation:blink 1.4s infinite}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font:10px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--ink3)}
.fld input,.fld textarea{padding:12px 13px;border-radius:12px;border:1px solid var(--edge);background:var(--desk);font-size:15px;width:100%}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(223,162,60,.13)}
.fld textarea{resize:vertical;min-height:96px;line-height:1.55}
.hero{display:flex;flex-direction:column;align-items:center;gap:11px;padding:24px 0 4px;text-align:center}
.hero h1{font-size:38px;letter-spacing:.27em;text-indent:.27em;background:linear-gradient(115deg,var(--ink) 26%,var(--amber2) 50%,var(--ink) 74%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font:10px/1.5 var(--mono);letter-spacing:.3em;color:var(--ink3);text-transform:uppercase}
.hero p{color:var(--ink2);font-size:13.5px;max-width:390px}
.bigc{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:17px;border-radius:16px;border:1px solid var(--edge);background:linear-gradient(145deg,var(--raise),var(--surf) 72%);transition:transform .15s,border-color .2s,box-shadow .25s}
.bigc:hover{border-color:var(--bc,var(--amber));box-shadow:0 12px 34px rgba(0,0,0,.42);transform:translateY(-2px)}
.bigc:active{transform:scale(.98)}
.bigc .ic{flex:none;width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--bc,var(--amber));background:var(--bcbg,rgba(223,162,60,.12));border:1px solid var(--bc45,rgba(223,162,60,.45))}
.bigc h3{font-size:17px;margin-bottom:3px}
.bigc p{font-size:12.5px;color:var(--ink2);line-height:1.45}
.scene{border-radius:16px;overflow:hidden;border:1px solid var(--edge);position:relative;box-shadow:0 16px 44px rgba(0,0,0,.5)}
.scene svg{width:100%;height:auto}
.scene .cap{position:absolute;inset:auto 0 0 0;padding:30px 14px 11px;background:linear-gradient(180deg,transparent,rgba(4,7,11,.93));display:flex;align-items:flex-end;justify-content:space-between;gap:9px}
.scene .cap h3{font-size:18px}
.scene .cap .s{font-size:11.5px;color:var(--ink2)}
.pick{display:flex;align-items:center;gap:11px;padding:9px;border-radius:13px;border:1px solid var(--edge);background:var(--surf);text-align:left;width:100%;transition:border-color .2s,transform .12s}
.pick:active{transform:scale(.985)}
.pick.on{border-color:var(--amber);background:linear-gradient(115deg,rgba(223,162,60,.11),var(--surf) 58%)}
.th{flex:none;width:74px;height:46px;border-radius:9px;overflow:hidden;border:1px solid var(--edge)}
.th svg{width:100%;height:100%}
.pick .t{font-weight:700;font-size:13.5px}
.pick .d{font-size:11px;color:var(--ink2);line-height:1.35}
.pick .rd{flex:none;margin-left:auto;width:19px;height:19px;border-radius:50%;border:2px solid var(--edge2);display:flex;align-items:center;justify-content:center;color:#231603}
.pick.on .rd{background:var(--amber);border-color:var(--amber)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 5px;border-radius:11px;border:1px solid var(--edge);background:var(--surf);font-size:12.5px;font-weight:700;color:var(--ink2);transition:all .18s}
.seg button.on{border-color:var(--amber);color:var(--amber);background:rgba(223,162,60,.1)}
.seg button small{display:block;font-weight:500;font-size:9.5px;color:var(--ink3);margin-top:2px}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.tabs::-webkit-scrollbar{height:0}
.tabs button{flex:none;padding:8px 12px;border-radius:10px;border:1px solid var(--edge);background:var(--surf);font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{border-color:var(--amber);color:var(--amber);background:rgba(223,162,60,.11)}
.tabs button .n{font:9px/1 var(--mono);padding:2px 4px;border-radius:4px;background:var(--raise);color:var(--ink2)}
.tabs button.on .n{background:rgba(223,162,60,.2);color:var(--amber2)}
.ev{position:relative;width:100%;text-align:left;border-radius:14px;border:1px solid var(--edge);border-left:4px solid var(--ec,var(--amber));background:linear-gradient(170deg,var(--surf2),var(--desk) 82%);padding:14px 15px 13px;overflow:hidden}
.ev+.ev{margin-top:10px}
.ev .head{display:flex;gap:11px;align-items:flex-start;margin-bottom:9px}
.ev .ico{flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ec,var(--amber));background:var(--ecbg,rgba(223,162,60,.11));border:1px solid var(--ec45,rgba(223,162,60,.42))}
.ev .ttl{font:700 16px/1.3 var(--serif)}
.ev .src{font:9px/1.4 var(--mono);letter-spacing:.13em;color:var(--ink3);text-transform:uppercase;margin-top:3px}
.ev .body{font-size:14px;line-height:1.62;color:#ced3db}
.ev .lab{margin-top:11px;padding:11px 12px;border-radius:10px;background:rgba(60,180,214,.07);border-left:3px solid var(--cyan);font-size:13.5px;line-height:1.6;color:#c6dbe3}
.ev .lab b{color:var(--cyan);font:11px/1.4 var(--mono);letter-spacing:.13em;display:block;margin-bottom:4px}
.ev .lab.wait{background:rgba(223,162,60,.07);border-left-color:var(--amber);color:#e4d2ac}
.ev .lab.wait b{color:var(--amber)}
.ev .foot{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center}
.ev.tap{cursor:pointer;transition:border-color .18s,transform .12s}
.ev.tap:active{transform:scale(.99)}
.ev.q{border-left-color:var(--violet)}
.pers{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:13px;border-radius:15px;border:1px solid var(--edge);background:linear-gradient(160deg,var(--surf2),var(--surf));transition:border-color .2s,transform .12s}
.pers:active{transform:scale(.99)}
.pers+.pers{margin-top:10px}
.pers.s2{border-color:rgba(214,65,77,.55);background:linear-gradient(160deg,rgba(214,65,77,.1),var(--surf))}
.pers.s1{border-color:rgba(223,162,60,.45)}
.pers.clear{border-color:rgba(92,191,120,.45);background:linear-gradient(160deg,rgba(92,191,120,.07),var(--surf))}
.pers .nm{font:700 16px/1.25 var(--serif)}
.pers .rl{font-size:11.5px;color:var(--amber);margin-top:2px}
.pers .bio{font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:6px}
.pers .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.act{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:13px;border:1px solid var(--edge);background:var(--surf);transition:border-color .18s,transform .12s}
.act+.act{margin-top:9px}
.act:hover{border-color:var(--edge2)}
.act:active{transform:scale(.99)}
.act:disabled{opacity:.42;pointer-events:none}
.act .ai{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ac,var(--amber));background:var(--acbg,rgba(223,162,60,.1));border:1px solid var(--ac45,rgba(223,162,60,.4))}
.act .at{font-weight:700;font-size:14px}
.act .ad{font-size:12px;color:var(--ink2);line-height:1.45;margin-top:3px}
.act .cost{flex:none;font:700 12px/1 var(--mono);color:var(--amber);padding:6px 8px;border-radius:8px;border:1px solid rgba(223,162,60,.35);background:rgba(223,162,60,.08);white-space:nowrap}
.act.done{border-color:rgba(92,191,120,.35)}
.act.done .cost{color:var(--ok);border-color:rgba(92,191,120,.35);background:rgba(92,191,120,.08)}
.contra{border-radius:14px;border:1px solid rgba(214,65,77,.5);background:linear-gradient(150deg,rgba(214,65,77,.12),var(--surf) 76%);padding:14px}
.contra+.contra{margin-top:11px}
.contra .ch{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.contra .ch b{font:700 13px/1.3 var(--sans);color:var(--blood2)}
.contra .side{padding:9px 11px;border-radius:9px;background:rgba(6,9,14,.55);font-size:13px;line-height:1.55;color:#d2d7df}
.contra .side+.side{margin-top:7px}
.contra .side em{font-style:normal;font:9px/1.4 var(--mono);letter-spacing:.13em;color:var(--ink3);display:block;text-transform:uppercase;margin-bottom:3px}
.contra .vs{text-align:center;font:700 10px/1 var(--mono);letter-spacing:.2em;color:var(--blood);margin:7px 0}
.tl{position:relative;padding-left:26px}
.tl:before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--edge),var(--edge2),var(--edge))}
.tli{position:relative;padding:9px 0}
.tli:before{content:'';position:absolute;left:-23px;top:15px;width:11px;height:11px;border-radius:50%;background:var(--surf);border:2px solid var(--edge2)}
.tli.known:before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 9px rgba(223,162,60,.6)}
.tli.crime:before{background:var(--blood);border-color:var(--blood);box-shadow:0 0 10px rgba(214,65,77,.7)}
.tli .t{font:700 12px/1 var(--mono);color:var(--amber)}
.tli.crime .t{color:var(--blood2)}
.tli .x{font-size:13.5px;line-height:1.5;margin-top:4px;color:#ced3db}
.tli.unknown .x{color:var(--ink3);font-style:italic}
.note{padding:12px 13px;border-radius:12px;background:rgba(232,220,192,.06);border:1px dashed rgba(232,220,192,.28);font-size:13.5px;line-height:1.6;color:#dcd5c3}
.jrn{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--edge);font-size:13px;line-height:1.5}
.jrn .jt{flex:none;font:9px/1.6 var(--mono);color:var(--ink3);width:42px}
.jrn.hi .jx{color:var(--amber2)}
.jrn.bad .jx{color:var(--blood2)}
.jrn.good .jx{color:var(--ok)}
.codebox{display:flex;flex-direction:column;align-items:center;gap:11px;padding:18px 14px;border-radius:17px;border:1px dashed var(--edge2);background:radial-gradient(circle at 50% 0%,rgba(60,180,214,.09),var(--surf) 70%)}
.bigcode{font:800 42px/1 var(--mono);letter-spacing:.32em;text-indent:.32em;color:var(--cyan);text-shadow:0 0 26px rgba(60,180,214,.4)}
.qrpaper{background:#f1e8d3;padding:12px;border-radius:6px;transform:rotate(-1.2deg);box-shadow:0 12px 32px rgba(0,0,0,.55);position:relative;min-width:188px;min-height:188px;display:flex;align-items:center;justify-content:center}
.qrpaper:before,.qrpaper:after{content:'';position:absolute;width:54px;height:16px;background:rgba(223,162,60,.35);top:-8px;transform:rotate(-4deg);left:14px;border-radius:2px}
.qrpaper:after{left:auto;right:14px;transform:rotate(5deg)}
.qrpaper img,.qrpaper canvas{display:block}
.plist{display:flex;flex-direction:column;gap:7px}
.lprow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:13px;background:var(--surf);border:1px solid var(--edge)}
.lprow .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.lprow .rl{font:9.5px/1 var(--mono);letter-spacing:.15em;color:var(--amber);border:1px solid rgba(223,162,60,.4);padding:3px 6px;border-radius:5px}
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(2,4,7,.8);backdrop-filter:blur(6px);animation:fade .22s both}
.sheet .box{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:580px;max-height:88vh;background:linear-gradient(180deg,var(--raise),var(--desk) 22%);border:1px solid var(--edge2);border-bottom:none;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:sheetup .34s cubic-bezier(.2,.8,.25,1) both;box-shadow:0 -22px 70px rgba(0,0,0,.7)}
@keyframes sheetup{from{transform:translate(-50%,70px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:15px 16px 12px;border-bottom:1px solid var(--edge)}
.sheet .sh h3{font-size:17px;flex:1}
.sheet .sb{overflow-y:auto;padding:15px 16px calc(22px + env(safe-area-inset-bottom))}
.full{position:fixed;inset:0;z-index:55;background:var(--void);display:none;flex-direction:column}
.full.on{display:flex}
.full .fh{flex:none;max-width:580px;margin:0 auto;width:100%;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--edge);background:linear-gradient(180deg,var(--desk),rgba(11,16,23,.9))}
.full .fb{flex:1;overflow-y:auto;max-width:580px;margin:0 auto;width:100%;padding:14px 14px calc(26px + env(safe-area-inset-bottom))}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:90;width:min(510px,calc(100vw - 22px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:13px;background:rgba(15,21,30,.98);border:1px solid var(--edge2);border-left:4px solid var(--tc,var(--cyan));box-shadow:0 16px 44px rgba(0,0,0,.55);font-size:13.5px;line-height:1.45;animation:tin .34s cubic-bezier(.2,.8,.25,1.1) both}
.toast.out{animation:tout .3s ease forwards}
.toast .td{flex:none;width:8px;height:8px;border-radius:50%;background:var(--tc,var(--cyan));margin-top:6px}
@keyframes tin{from{opacity:0;transform:translateY(-18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.95)}}
#lost{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(2,4,7,.93);padding:22px}
#lost.on{display:flex}
#lost .lb{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;text-align:center}
#fx{position:fixed;inset:0;z-index:80;pointer-events:none}
.verdict{border-radius:18px;padding:20px 17px;text-align:center;border:1px solid var(--vc45);background:linear-gradient(160deg,var(--vcbg),var(--surf) 78%);position:relative;overflow:hidden}
.verdict .k{font:10px/1 var(--mono);letter-spacing:.3em;color:var(--vc)}
.verdict h2{font-size:26px;margin:8px 0 6px;color:var(--vc)}
.verdict p{font-size:13.5px;color:var(--ink2);line-height:1.55}
.verdict .stmp{position:absolute;top:14px;right:12px;animation:stamp .6s .3s both}
.epi{padding:12px 13px;border-radius:12px;background:var(--surf);border:1px solid var(--edge);font-size:13.5px;line-height:1.6}
.epi+.epi{margin-top:9px}
.epi .r{font:11px/1.4 var(--mono);letter-spacing:.11em;color:var(--ink3);display:block;margin-bottom:5px;text-transform:uppercase}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.galc{padding:11px;border-radius:12px;border:1px solid var(--edge);background:var(--surf);font-size:12.5px;line-height:1.4}
.galc.got{border-color:var(--gc45);background:linear-gradient(150deg,var(--gcbg),var(--surf) 78%)}
.galc b{display:block;font-family:var(--serif);font-size:13.5px;color:var(--gc,var(--ink3));margin-bottom:4px}
.galc .lk{color:var(--ink3);font-style:italic}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:380px){.hero h1{font-size:29px}.clock .digits{font-size:22px}.gal{grid-template-columns:1fr}.bigcode{font-size:33px}}
</style>
</head>

<div id="atmos" aria-hidden="true">
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="lamp"></div><div class="grain"></div><div class="vig"></div>

  proofs.means.push(hidden.id);
  sus.forEach(function(s){
    if(s.idx===cul)return;
    var nm=r.p(MOTIVES.filter(function(m){return m.id!==mot.id;}));

    var e=add({k:'doc',src:'Документы',loc:7,ico:'file',n:'Проверка мотива: '+s.n,

  var fc=8+D.extra;
  for(var f=0;f<fc;f++){

  var qs=[

  var tips={};

  return{seed:seed,setId:setId,diff:diffId,no:'№'+seed,
    budget:D.budget,left:D.budget,insights:D.ins+(players.length===1?2:0),
    victim:st.victim,intro:st.intro,
    truth:{cul:sus[cul].id,culN:CN,acc:acc===null?null:sus[acc].id,accN:acc===null?null:sus[acc].n,
      method:method.id,methodN:method.n,place:crimeIdx,placeN:crimeLoc.n,mot:mot.id,motN:mot.n,
      time:crimeTime,timeIdx:tIdx},
    proofs:proofs,suspects:sus,
    locs:st.locs.map(function(l,i){return{idx:i,n:l.n,d:l.d,crime:!!l.crime,arch:!!l.arch,visits:0,dug:0};}),
    ev:ev,qs:qs,timeline:timeline,tips:tips,
    autopsy:false,recon:false,accRevealed:false,
    initial:['Тело обнаружено в '+crimeLoc.n.toLowerCase()+'. Предварительно: '+method.n.toLowerCase()+'.',
      'Время смерти ориентировочно '+crimeTime+', погрешность ±40 минут. Точное даст вскрытие.',
      'Все шестеро находились в пределах досягаемости. Никто не мог покинуть место.'],
    journal:[],notes:'',warned:false,accused:null,ending:null,
    players:players.map(function(p){return{id:p.id,name:p.name};}),turnIdx:0,

}
function makeTip(r,sus,cul,acc,st,crimeLoc,i){

    'Информатор: '+r.p(inn).n+' лжёт, но не об убийстве. Ищите в личных вещах.',
    'Из сводки: орудие принесли с собой. Оно не из этого места — ищите, кто мог его достать.',
    'Слышал(а) от дежурного: в '+crimeLoc.n.toLowerCase()+' спрятано больше, чем видно при первом осмотре.',
    'Совет: пока не отправите вещдок в лабораторию, он не доказывает ничего. Начните с этого.',
    'Информатор: '+r.p(inn).n+' точно не был(а) на месте преступления. Не тратьте на него время.',
    'Из сводки: у половины шестерых есть мотив на бумаге. У большинства он уже погашен — ищите справки.'];

}

function rankOf(xp){
  var i=0;for(var k=0;k<RANKS.length;k++)if(xp>=RANKS[k][0])i=k;
  var nx=RANKS[i+1]||null,b=RANKS[i][0];
  return{n:RANKS[i][1],i:i,next:nx?nx[1]:null,left:nx?nx[0]-xp:0,pct:nx?Math.min(100,Math.round((xp-b)/(nx[0]-b)*100)):100};
}
function saveGame(){
  if(!A.C||A.net==='guest')return;
  try{LS.set('rzv_save',JSON.stringify({c:A.C,mode:A.mode}));}catch(e){}
}

/* ═════ ПРОИЗВОДНЫЕ ═════ */
function C(){return A.C;}
function sus(id){var r=null;C().suspects.forEach(function(s){if(s.id===id)r=s;});return r;}
function evById(id){var r=null;C().ev.forEach(function(e){if(e.id===id)r=e;});return r;}
function found(){return C().ev.filter(function(e){return e.found;});}
function evAt(i){return C().ev.filter(function(e){return e.loc===i;});}
function usable(){return found().filter(function(e){return !e.needsLab||e.analyzed;});}
function evColor(e){
  if(e.k==='test')return'#a377e6';
  if(e.clears||e.neutral)return'#5cbf78';
  if(e.incrim)return'#d6414d';
  var P=C().proofs;
  if(P.means.indexOf(e.id)>=0||P.opp.indexOf(e.id)>=0||P.mot.indexOf(e.id)>=0)return'#dfa23c';
  if(e.k==='doc')return'#3cb4d6';
  return'#8a94a3';
}
function evKind(e){
  if(e.k==='test')return'Показание';
  if(e.needsLab&&!e.analyzed)return'Вещдок · нужна экспертиза';
  if(e.needsLab&&e.analyzed)return'Вещдок · экспертиза готова';
  if(e.k==='doc')return'Документ';
  return'Материал';
}
function isProof(e){var P=C().proofs;return P.means.indexOf(e.id)>=0||P.opp.indexOf(e.id)>=0||P.mot.indexOf(e.id)>=0;}
function jr(kind,text){C().journal.unshift({left:C().left,kind:kind,text:text});if(C().journal.length>220)C().journal.pop();}
function progress(){
  var f=found().length,t=C().ev.length,q=0;
  C().suspects.forEach(function(s){q+=Object.keys(s.asked).length;});
  return{ev:f,total:t,q:q,qTotal:C().suspects.length*C().qs.length,
    clear:C().suspects.filter(function(s){return s.cleared;}).length};
}
function contradictions(){
  var c=C(),out=[],cul=sus(c.truth.cul);
  if(cul.asked.alibi){
    c.proofs.opp.forEach(function(id){
      var e=evById(id);if(!e||!e.found||(e.needsLab&&!e.analyzed))return;
      out.push({id:'opp-'+e.id,who:cul.n,sid:cul.id,
        a:{t:'Слова '+cul.n,txt:'«С '+cul.alibi.from+' до '+cul.alibi.to+' я был(а) в '+cul.alibi.place.toLowerCase()+'. Можете спросить кого угодно».'},
        b:{t:e.n,txt:e.analyzed&&e.lab?e.lab:e.txt},
        hint:'Алиби не выдерживает проверки. Предъявите это '+cul.n+' — или используйте как доказательство возможности.'});
    });
  }
  if(cul.alibi.smooth&&cul.alibi.witness){
    var w=sus(cul.alibi.witness);
    out.push({id:'cover',who:cul.n+' и '+w.n,sid:w.id,face:cul.id,
      a:{t:'Алиби '+cul.n,txt:'«Я был(а) в '+cul.alibi.place.toLowerCase()+'». '+w.n+' подтверждает слово в слово.'},
      b:{t:'Проверка алиби',txt:'Совпадение дословное, до порядка фраз. Так не вспоминают — так репетируют.'},
      hint:'Кто-то покрывает. Устройте очную ставку между этими двумя.'});
  }
  c.suspects.forEach(function(s){
    if(s.idx===cul.idx||!s.secret||!s.secret.evId)return;
    var e=evById(s.secret.evId);if(!e||!e.found)return;
    if(!(s.asked.rel||s.asked.press||s.asked.alibi))return;
    out.push({id:'sec-'+s.id,who:s.n,sid:s.id,
      a:{t:'Поведение '+s.n,txt:s.n+' '+s.secret.lie+' и уходит(а) от прямых ответов.'},
      b:{t:e.n,txt:e.txt},
      hint:s.secret.id==='accomp'?'Это не безобидная тайна. Предъявите — и он(а) признается в пособничестве.'
        :'Ложь может объясняться не убийством. Предъявите улику — и увидите, что за ней.'});
  });
  return out;
}
function knownRels(){
  var o=[];C().suspects.forEach(function(s){if(s.asked.rel||s.met)o.push(s);});return o;
}
function turnName(){
  var c=C();if(!c||c.players.length<2)return null;
  var p=c.players[c.turnIdx];return p?p.name:null;
}
function costFor(base,pid){
  var c=C();if(c.players.length<2)return base;
  var cur=c.players[c.turnIdx];
  return base+((cur&&cur.id!==pid)?1:0);
}

/* ═════ ДЕЙСТВИЯ ═════ */
function perform(op,args){
  if(A.net==='guest'){
    if(NET.conn&&NET.conn.open){try{NET.conn.send({t:'do',op:op,args:args||{}});}catch(e){toast('Нет связи с хостом','bad');}}
    else toast('Нет связи с хостом','bad');
    return;
  }
  applyOp(op,args||{},A.me);
  if(A.net==='host')broadcast();
  saveGame();render();
}
function reveal(e,silent){
  if(!e||e.found)return false;
  e.found=true;
  if(!silent){jr('find','Найдено: '+e.n+'.');toast('Новая улика: '+e.n,'find');sfx('find');vib(15);}
  return true;
}
function applyOp(op,a,pid){
  var c=C();if(!c||c.ending)return;
  if(op==='note'){c.notes=String(a.v||'').slice(0,4000);return;}
  if(op==='susp'){var ss=sus(a.sid);if(ss){ss.susp=a.v;jr('',ss.n+': отметка «'+['не подозреваю','под вопросом','главный подозреваемый'][a.v]+'».');sfx('pick');}return;}
  var base=0,advance=true;
  if(op==='search')base=a.deep?6:3;
  else if(op==='records')base=4;
  else if(op==='personal')base=(contradictions().some(function(x){return x.sid===a.sid;}))?4:7;
  else if(op==='ask'){var q=null;c.qs.forEach(function(x){if(x.id===a.qid)q=x;});base=q?q.cost:2;}
  else if(op==='confront')base=2;
  else if(op==='alibi')base=3;
  else if(op==='face')base=5;
  else if(op==='lab')base=4;
  else if(op==='autopsy')base=4;
  else if(op==='recon')base=5;
  else if(op==='timeline')base=3;
  else if(op==='insight'){base=0;advance=false;}
  else if(op==='accuse'){base=0;advance=false;}
  else return;
  var cost=costFor(base,pid);
  if(op!=='insight'&&op!=='accuse'&&c.left<cost){
    toast('Времени не хватает: нужно '+hrs(cost)+', осталось '+hrs(c.left)+'.','bad');sfx('err');return;
  }
  if(op==='insight'){
    if(c.insights<=0){toast('Озарений больше нет.','warn');sfx('err');return;}
    c.insights--;doInsight();return;
  }
  if(op==='accuse'){doAccuse(a);return;}
  c.left=Math.max(0,c.left-cost);
  if(c.left<=12&&c.left>0)sfx('clock');
  if(op==='search')doSearch(a);
  else if(op==='records')doRecords(a);
  else if(op==='personal')doPersonal(a);
  else if(op==='ask')doAsk(a);
  else if(op==='confront')doConfront(a);
  else if(op==='alibi')doAlibi(a);
  else if(op==='face')doFace(a);
  else if(op==='lab')doLab(a);
  else if(op==='autopsy')doAutopsy();
  else if(op==='recon')doRecon();
  else if(op==='timeline')doTimeline();
  if(advance&&c.players.length>1)c.turnIdx=(c.turnIdx+1)%c.players.length;
  if(c.left<=0&&!c.ending)timeOut();
}
function doSearch(a){
  var c=C(),L=c.locs[a.loc];
  var pool=c.ev.filter(function(e){return e.loc===a.loc&&!e.found&&e.depth<=(a.deep?2:1);});
  if(!pool.length)pool=c.ev.filter(function(e){return e.loc===a.loc&&!e.found;});
  L.visits++;L.dug=Math.max(L.dug,a.deep?2:1);
  if(!pool.length){jr('','Обыск в '+L.n.toLowerCase()+' ничего нового не дал.');toast('Здесь больше ничего нет. Время потрачено.','warn');sfx('warn');return;}
  var take=a.deep?Math.min(3,pool.length):Math.min(2,pool.length),got=[];
  for(var i=0;i<take;i++)if(reveal(pool[i],true))got.push(pool[i]);
  got.forEach(function(e,i){setTimeout(function(){toast('Найдено: '+e.n,'find');sfx('find');},i*280);});
  jr('find',(a.deep?'Тщательный обыск':'Осмотр')+' в '+L.n.toLowerCase()+': '+got.length+' '+plural(got.length,['улика','улики','улик'])+'.');
  vib(18);sfx('page');
}
function doRecords(a){
  var c=C();
  var pool=c.ev.filter(function(e){return e.loc===a.loc&&!e.found&&(e.k==='doc'||e.neutral);});
  if(!pool.length)pool=c.ev.filter(function(e){return e.loc===a.loc&&!e.found;});
  if(!pool.length){toast('В документах больше ничего нового.','warn');sfx('warn');jr('','Проверка документов ничего не дала.');return;}

}

    else if(k==='closed'||k==='walked'||k==='almost'||k==='brutal'||k==='holeacc'){sfx('half');rain(['#dfa23c','#bf5f2a','#ece5d4'],60);}
    else{sfx('lose');rain(['#6b7585','#d6414d','#3b4d64'],70);}
  },480);

function resolveEnding(acc){
  var c=C(),T=c.truth,cul=sus(T.cul);
  var pr=progress(),u=usable();
  var right=!!acc&&acc.who===T.cul;
  var pm=!!acc&&acc.means&&c.proofs.means.indexOf(acc.means)>=0&&u.some(function(e){return e.id===acc.means;});
  var po=!!acc&&acc.opp&&c.proofs.opp.indexOf(acc.opp)>=0&&u.some(function(e){return e.id===acc.opp;});
  var pt=!!acc&&acc.mot&&c.proofs.mot.indexOf(acc.mot)>=0&&u.some(function(e){return e.id===acc.mot;});
  var chain=(pm?1:0)+(po?1:0)+(pt?1:0);
  var accEx=!!T.acc,accNamed=!!acc&&!!acc.acc,accRight=accNamed&&acc.acc===T.acc;
  var accWrong=accNamed&&!accRight;
  var cleared=pr.clear,foundN=pr.ev,total=pr.total;
  var leftPct=c.left/c.budget;
  var accusedClear=!!acc&&sus(acc.who)&&sus(acc.who).cleared;
  var accusedIsAcc=!!acc&&accEx&&acc.who===T.acc;
  var hand=chainFromHand();
  var unlab=found().filter(function(e){return e.needsLab&&!e.analyzed;}).length;
  var x={acc:acc,right:right,chain:chain,pm:pm,po:po,pt:pt,accEx:accEx,accNamed:accNamed,
    accRight:accRight,accWrong:accWrong,cleared:cleared,found:foundN,total:total,
    left:c.left,leftPct:leftPct,warned:c.warned,accusedClear:accusedClear,accusedIsAcc:accusedIsAcc,hand:hand};
  var key;
  if(!acc){
    if(c.warned&&hand===3)key='fledproof';
    else if(c.warned)key='fled';
    else if(foundN/total>=.7)key='almost';
    else if(foundN/total<.3)key='coldcase';
    else if(unlab>=2&&hand===0)key='noproof';
    else key='archive';
  }else if(!right){
    if(accusedClear)key='wrongcleared';
    else if(accusedIsAcc)key='wrongacc';
    else if(c.warned)key='wrongwarned';
    else if(cleared>=4)key='wrongclean';
    else key='wrong';
  }else{
    if(chain===3){
      if((!accEx||accRight)&&cleared>=4)key='perfect';
      else if(accEx&&accRight)key='web';
      else if(leftPct>=.45)key='swift';
      else if(c.left<=8)key='lastmin';
      else if(accEx&&!accNamed)key='secondstrike';
      else if(accWrong)key='doubleerr';
      else if(cleared===0)key='brutal';
      else if(cleared>=5)key='cityclean';
      else key='convict';
    }else if(chain===2){
      if(accWrong)key='holeacc';
      else if(accEx&&!accNamed)key='secondstrike';
      else if(cleared>=5)key='cityclean';
      else if(cleared===0)key='brutal';
      else key='closed';
    }else key=chain===0?'guess':'walked';
  }
  var def=ENDMAP[key]||ENDMAP.archive;
  var desc=def.d.replace(/\{C\}/g,cul.n).replace(/\{A\}/g,T.acc?sus(T.acc).n:'сообщник');
  var bonus=[];
  if(accRight)bonus.push('Сообщник назван верно: '+sus(T.acc).n+'. Второй удар не состоится.');
  if(c.accRevealed&&!accNamed)bonus.push('Вы вскрыли пособничество на допросе, но не вписали его в обвинение. Он ушёл.');
  if(cleared>=5)bonus.push('Все пять чужих тайн раскрыты и объяснены. Редкий исход.');
  else if(cleared>=3)bonus.push(cleared+' невиновных избавлены от подозрений найденными разоблачениями.');
  if(foundN>=Math.floor(total*.8))bonus.push('Собрано '+foundN+' из '+total+' материалов дела — почти полный объём.');
  if(c.autopsy)bonus.push('Вскрытие проведено: способ и точное время зафиксированы документом.');
  if(c.recon)bonus.push('Реконструкция сцены выполнена: число участников установлено.');
  var score=0;
  if(right)score+=40;
  score+=chain*15;
  if(accRight)score+=16;
  score+=cleared*4;
  score+=Math.floor(c.left/6);
  if(c.autopsy)score+=4;
  if(c.recon)score+=4;
  if(!acc)score=Math.floor(score*.2);
  var xp=Math.round(score*(c.diff==='hard'?1.5:c.diff==='soft'?.7:1));
  var epis=[];
  c.suspects.forEach(function(s){
    var t;
    if(s.id===T.cul){
      if(key==='perfect'||key==='convict'||key==='web'||key==='swift'||key==='lastmin'||key==='cityclean')t='Признан(а) виновным(ой). Мотив — '+T.motN.toLowerCase()+'. Приговор реальный.';
      else if(key==='closed'||key==='holeacc'||key==='secondstrike'||key==='brutal')t='Обвинение предъявлено. Дело уйдёт в суд с одной слабой точкой.';
      else if(key==='walked'||key==='guess')t='Отпущен(а). Улики не сложились в цепь. Уехал(а) из города в тот же месяц.';
      else if(!acc)t=c.warned?'Пропал(а) без вести. Объявлен(а) в розыск — поздно.':'Не назван(а). Дело закрыто без виновного.';
      else t='Остался(ась) свидетелем по делу. Дал(а) показания спокойно и подробно.';
    }else if(acc&&acc.who===s.id){
      t=s.cleared?'Задержан(а) по вашему обвинению. Его тайна была раскрыта вами — и она не про убийство. Ошибка признана.'
        :'Задержан(а) по вашему обвинению. Оснований не было. Через неделю отпустили, через месяц он уехал.';
    }else if(accEx&&s.id===T.acc){
      t=accRight?'Признан(а) соучастником. Показал(а), как всё было.'
        :'Остался(ась) вне дела. Пособничество так и не было доказано — и он(а) это знает.';
    }else if(s.cleared){
      t='Подозрения сняты при жизни дела. Тайна раскрыта и объяснена: '+s.secret.n.toLowerCase()+'. Вернулся(ась) к обычной жизни.';
    }else{
      t='Остался(ась) под подозрением до конца. Свою тайну так и не объяснил(а) — и это осталось на нём/ней.';
    }
    epis.push({n:s.n,r:s.r,t:t});
  });
  return{k:key,title:def.t,vc:def.c,desc:desc,bonus:bonus,score:score,xp:xp,epis:epis,
    chain:chain,pm:pm,po:po,pt:pt,right:right,accRight:accRight,cleared:cleared,
    hand:hand,fled:!acc&&c.warned,at:Date.now()};
}
function recordCase(){
  var c=C(),e=c.ending,ca=career();
  if(ca.last===c.cid)return;
  var before=rankOf(ca.xp);
  ca.last=c.cid;ca.xp+=e.xp;ca.cases++;
  if(e.right&&e.chain>=2)ca.solved++;
  if(e.k==='perfect')ca.perfect++;
  ca.best=Math.max(ca.best,e.score);
  ca.ends[e.k]=true;
  var s=ca.sets[c.setId]||{p:0,w:0,f:0};
  s.p++;if(e.right&&e.chain>=2)s.w++;if(e.k==='perfect')s.f++;
  ca.sets[c.setId]=s;
  ca.arch.unshift({no:c.no,set:c.setId,diff:c.diff,k:e.k,title:e.title,score:e.score,who:c.truth.culN,date:Date.now()});
  ca.arch=ca.arch.slice(0,30);
  saveCar();
  var after=rankOf(ca.xp);
  if(after.i>before.i)setTimeout(function(){toast('Новое звание: '+after.n,'ok');sfx('win');rain(['#dfa23c','#f6ca6c','#bf5f2a'],70);},1500);
}

function webSVG(rel){
  var u='w'+(UID++),p=[],W=480,H=340,cx=W/2,cy=H/2,rad=118;
  p.push('<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Схема связей">');
  p.push('<defs><radialGradient id="'+u+'c"><stop offset="0" stop-color="#d6414d" stop-opacity=".35"/><stop offset="1" stop-color="#d6414d" stop-opacity="0"/></radialGradient></defs>');
  p.push(rc(0,0,W,H,'#0a0f16',' rx="12"'));
  for(var i=0;i<40;i++)p.push(cr((i*97)%W,(i*61)%H,.7,'#2a3849',' opacity=".5"'));
  var pos=[];
  for(var k=0;k<6;k++){var a=-Math.PI/2+k*(Math.PI*2/6);pos.push({x:cx+Math.cos(a)*rad*1.35,y:cy+Math.sin(a)*rad});}
  rel.forEach(function(s){
    var P=pos[s.idx],col=RELK[s.relKind].c;
    var mx=(cx+P.x)/2+(s.idx%2?16:-16),my=(cy+P.y)/2+(s.idx%3?10:-12);
    p.push('<path d="M'+cx+' '+cy+' Q'+mx+' '+my+' '+P.x+' '+P.y+'" fill="none" stroke="'+col+'" stroke-width="2" opacity=".75"/>');
    p.push(cr(mx,my,3,col));
  });
  p.push(cr(cx,cy,44,'url(#'+u+'c)')+cr(cx,cy,25,'#18222f',' stroke="#d6414d" stroke-width="2"'));
  p.push('<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#ff727b">ЖЕРТВА</text>');
  p.push('<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-family="monospace" font-size="8" fill="#a5aebc">'+esc(C().victim.n.split(' ')[0])+'</text>');
  pos.forEach(function(P,i){
    var s=C().suspects[i],kn=rel.some(function(x){return x.idx===i;});
    var col=s.cleared?'#5cbf78':s.susp===2?'#d6414d':kn?'#dfa23c':'#3b4d64';
    p.push(cr(P.x,P.y,20,'#121a24',' stroke="'+col+'" stroke-width="2"'));
    p.push('<text x="'+P.x+'" y="'+(P.y+4)+'" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="'+col+'">'+esc(s.n.charAt(0))+'</text>');
    var nm=s.n.split(' ');
    p.push('<text x="'+P.x+'" y="'+(P.y+34)+'" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" fill="#a5aebc">'+esc(nm[0])+'</text>');
    p.push('<text x="'+P.x+'" y="'+(P.y+45)+'" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" fill="#a5aebc">'+esc(nm[1]||'')+'</text>');
  });
  p.push('</svg>');return p.join('');
}

function needLib(kind,url,gn,cb){
  if(window[gn])return cb(true);
  if(LIB[kind]==='loading'){LIB[kind+'Q'].push(cb);return;}
  if(LIB[kind]==='fail')return cb(false);
  LIB[kind]='loading';LIB[kind+'Q']=[cb];
  var s=document.createElement('script');s.src=url;
  var done=function(ok){
    var good=ok&&!!window[gn];LIB[kind]=good?'ok':'fail';
    var q=LIB[kind+'Q'];LIB[kind+'Q']=[];
    q.forEach(function(f){try{f(good);}catch(e){}});
  };
  s.onload=function(){done(true);};s.onerror=function(){done(false);};
  document.head.appendChild(s);
}

    destroyNet();

    try{peer=new Peer('rzvd-'+code);}catch(e){netErr('Не удалось создать соединение.');return;}
    NET.peer=peer;
    peer.on('open',function(){
      NET.code=code;NET.setId=A.setId;NET.diff=A.diff;NET.seed=A.seed;
      NET.players=[{id:'p0',name:name,connected:true}];NET.seq=1;
      A.screen='lobby';render();sfx('join');
      toast('Комната открыта. Код: '+code,'ok');
      NET.hb=setInterval(function(){
        Object.keys(NET.conns).forEach(function(k){var cn=NET.conns[k];if(cn&&cn.open){try{cn.send({t:'hb'});}catch(e){}}});
      },4000);
    });
    peer.on('connection',function(cn){
      cn.on('data',function(m){hostData(cn,m);});
      cn.on('close',function(){hostClosed(cn);});
      cn.on('error',function(){hostClosed(cn);});
    });
    peer.on('disconnected',function(){try{peer.reconnect();}catch(e){}});
    peer.on('error',function(err){
      var ty=err&&err.type;
      if(ty==='unavailable-id'){
        try{peer.destroy();}catch(e){}
        if(attempt<4)hostCreate(attempt+1);else netErr('Не удалось подобрать свободный код комнаты.');
      }else if(ty==='network'||ty==='server-error'||ty==='socket-error'||ty==='socket-closed'){
        if(!NET.code)netErr('Сигнальный сервер недоступен. Для сети нужен интернет при подключении; дальше трафик идёт напрямую.');
        else toast('Проблема с сигнальным сервером — подключённые продолжают игру.','warn');
      }
    });
  });
}
function hostData(cn,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='join'){
    if(A.C){try{cn.send({t:'started'});}catch(e){}return;}
    if(NET.players.length>=5){try{cn.send({t:'full'});}catch(e){}return;}
    var pid='p'+(NET.seq++),nm=String(m.name||'Следователь').slice(0,18);
    NET.players.push({id:pid,name:nm,connected:true});
    NET.conns[pid]=cn;cn.__pid=pid;
    try{cn.send({t:'welcome',pid:pid,l:lobbyState()});}catch(e){}
    toast(nm+' подключился(а).','ok');sfx('join');
    A.screen='lobby';broadcast();render();
  }else if(m.t==='rejoin'){
    var p=null;NET.players.forEach(function(x){if(x.id===m.pid)p=x;});
    if(!p){try{cn.send({t:'started'});}catch(e){}return;}
    var old=NET.conns[p.id];if(old&&old!==cn){try{old.close();}catch(e){}}
    p.connected=true;NET.conns[p.id]=cn;cn.__pid=p.id;
    try{cn.send({t:'welcome',pid:p.id,l:A.C?null:lobbyState(),c:A.C||null,screen:A.screen});}catch(e){}
    toast(p.name+' снова в сети.','ok');broadcast();render();
  }else if(m.t==='do'){
    if(cn.__pid){applyOp(m.op,m.args||{},cn.__pid);broadcast();saveGame();render();}
  }else if(m.t==='bye')hostClosed(cn);
}
function hostClosed(cn){
  var pid=cn.__pid;if(!pid||NET.conns[pid]!==cn)return;
  delete NET.conns[pid];
  var p=null;NET.players.forEach(function(x){if(x.id===pid)p=x;});
  if(!p)return;
  if(!A.C){NET.players=NET.players.filter(function(x){return x.id!==pid;});toast(p.name+' покинул(а) комнату.','warn');}
  else{p.connected=false;toast(p.name+' потерял(а) связь.','warn');}
  broadcast();render();
}
function joinRoom(code,name,rejoin,silent){
  code=String(code||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(code.length!==4){toast('Код комнаты — 4 латинские буквы.','warn');return;}
  name=(name||'').trim()||'Следователь';LS.set('rzv_name',name);
  if(!silent){destroyNet();A.screen='conn';A.connMsg=rejoin?'Возвращаемся в комнату…':'Подключаемся к '+code+'…';render();}
  A.net='guest';A.joinCode=code;A.joinName=name;NET.code=code;
  needLib('peer',PURL,'Peer',function(ok){
    if(A.net!=='guest')return;
    if(!ok){joinFail('Не удалось загрузить библиотеку связи. Соло и команда работают офлайн.');return;}
    var go=function(){
      var cn;
      try{cn=NET.peer.connect('rzvd-'+code,{reliable:true});}catch(e){joinFail('Не удалось открыть соединение.');return;}
      NET.conn=cn;
      var opened=false;
      later('jwait',function(){if(!opened&&A.net==='guest'&&!A.C&&A.screen!=='lobby')joinFail('Хост не отвечает. Комната должна быть открыта, устройства — в одной Wi-Fi сети.');},9000);
      cn.on('open',function(){
        opened=true;stop('jwait');
        try{cn.send(rejoin?{t:'rejoin',pid:rejoin,name:name}:{t:'join',name:name});}catch(e){}
      });
      cn.on('data',function(m){guestData(m);});
      cn.on('close',function(){if(A.net==='guest'&&(A.C||A.screen==='lobby'))enterLost();else if(A.net==='guest')joinFail('Соединение закрыто хостом.');});
      cn.on('error',function(){if(A.net==='guest'&&(A.C||A.screen==='lobby'))enterLost();});
    };
    if(!NET.peer||NET.peer.destroyed){
      var peer;
      try{peer=new Peer();}catch(e){joinFail('Не удалось создать сетевой узел.');return;}
      NET.peer=peer;
      peer.on('open',go);
      peer.on('disconnected',function(){try{peer.reconnect();}catch(e){}});
      peer.on('error',function(err){
        var ty=err&&err.type;
        if(ty==='peer-unavailable'&&!A.C&&A.screen!=='lobby')joinFail('Комната '+code+' не найдена. Проверьте код и что хост держит комнату открытой.');
        else if((ty==='network'||ty==='server-error'||ty==='socket-error')&&!A.C&&A.screen!=='lobby')joinFail('Сигнальный сервер недоступен. Попробуйте соло или команду за одним экраном.');
      });
      later('jwait',function(){if((!NET.conn||!NET.conn.open)&&!A.C&&A.screen!=='lobby')joinFail('Не удалось связаться с сетью.');},12000);
    }else if(NET.peer.open)go();
    else NET.peer.once('open',go);
    if(!NET.watch)NET.watch=setInterval(function(){
      if(A.net==='guest'&&(A.C||A.screen==='lobby')&&!A.lost&&Date.now()-NET.last>12000)enterLost();
    },3000);
  });
}
function joinFail(m){stop('jwait');netErr(m);}
function guestData(m){
  if(!m||typeof m!=='object')return;
  NET.last=Date.now();
  if(A.lost&&(m.t==='lobby'||m.t==='game'||m.t==='hb'||m.t==='welcome')){A.lost=false;A.retries=0;renderLost();toast('Связь восстановлена.','ok');}
  if(m.t==='welcome'){
    A.me=m.pid;A.retries=0;SS.set({code:NET.code,pid:m.pid,name:A.joinName});
    if(m.l){applyLobby(m.l);A.C=null;A.screen='lobby';}
    if(m.c){A.C=m.c;A.screen=m.screen||'hub';}
    sfx('join');render();
  }else if(m.t==='lobby'){applyLobby(m.l);A.C=null;A.screen='lobby';render();}
  else if(m.t==='game'){
    A.C=m.c;
    if(A.screen==='lobby'||A.screen==='conn')A.screen=m.screen||'brief';
    if(m.c.ending)A.screen='end';
    if(A.screen==='file'||A.screen==='person'||A.screen==='loc'||A.screen==='accuse'){
      if(m.c.ending)A.screen='end';
    }
    render();
  }
  else if(m.t==='closed')netErr('Хост закрыл комнату.');
  else if(m.t==='kicked')netErr('Хост исключил вас из комнаты.');
  else if(m.t==='full')netErr('Комната заполнена: максимум 5 следователей.');
  else if(m.t==='started')netErr('Дело уже идёт. Дождитесь нового дела и войдите снова.');
}
function applyLobby(l){
  if(!l)return;
  NET.players=l.players;NET.setId=l.setId;NET.diff=l.diff;NET.seed=l.seed;
  A.setId=l.setId;A.diff=l.diff;A.seed=l.seed;
}
function enterLost(){
  if(A.lost||A.net!=='guest')return;
  A.lost=true;renderLost();sfx('err');vib(40);
  var att=function(){
    if(!A.lost||A.net!=='guest')return;
    A.retries++;
    try{if(NET.conn)NET.conn.close();}catch(e){}
    NET.conn=null;joinRoom(NET.code,A.joinName,A.me,true);
    if(A.retries<3)later('recon',att,A.retries===1?5000:9000);
  };
  later('recon',att,1500);
}
function renderLost(){
  var el=$('#lost');if(!el)return;
  if(!A.lost){el.className='';el.innerHTML='';return;}
  el.className='on';
  el.innerHTML='<div class="lb"><div class="spin"></div><h2 style="font-size:21px">Связь с хостом потеряна</h2>'
    +'<p class="mut">'+(A.retries<3?'Переподключаемся автоматически… попытка '+Math.max(1,A.retries+1)+' из 3.':'Автопопытки исчерпаны. Проверьте Wi-Fi и попробуйте вручную.')+'</p>'
    +'<button class="btn btn-c" data-a="retry">'+ic('wifi',18)+'Переподключиться</button>'
    +'<button class="btn btn-g" data-a="menu">'+ic('home',18)+'Выйти в меню</button></div>';
}
