var CASES=[
{k:'hotel',t:'Полночь в «Меридиане»',d:2,lim:9,v:['Аркадий Вельман','владелец отеля'],
in:'Шторм отрезал отель от берега. В 00:20 владельца нашли мёртвым у подножия парадной лестницы. Связка ключей исчезла. Шестеро заперты под одной крышей до утра.',
s:[['Марта Рей','управляющая','Двенадцать лет держала отель на себе. Знала все счета.'],['Оскар Гиль','ночной портье','Видит всех, кто входит и выходит. Записывает больше, чем нужно.'],['Лиля фон Дорн','постоянная гостья','Номер 307 каждый месяц. Платит наличными.'],['Бруно Кайзер','шеф-повар','Вспыльчив, горд, должен всем поставщикам.'],['Аглая Северина','певица бара','Третий сезон здесь. О столице не говорит.'],['Тео Марш','консьерж','Достанет что угодно. Игрок. Проигрывает чаще, чем выигрывает.']],
pl:['Парадная лестница','Кабинет владельца','Винный погреб','Бар «Прилив»','Кухня','Котельная'],
c:[['e','Часы на лестнице','Разбиты, стоят на 00:05. Осколки стекла лежат поверх механизма, внутри корпуса.'],['e','Заключение врача','Смерть около 23:20, не позже. Один удар в затылок тупым тяжёлым предметом.'],['m','Парадная лестница','Крови на ступенях нет. Пятно волочения тянется от двери кабинета.'],['m','Кабинет владельца','На ковре у сейфа свежая кровь и вмятина. Сейф открыт, бумаги разложены.'],['u','Бронзовый ключ-мастер','Тяжёлый ключ от всех дверей найден в ведре котельной. Кровь смыта, но не из щелей.'],['d','Опись связки','В связке Вельмана не хватает ключа-мастера. Остальные семь на месте.'],['p','Марта Рей','«С 23:00 до полуночи сводила кассу. Оскар приносил отчёт в 23:30».'],['p','Оскар Гиль','«В 23:30 отнёс отчёт Марте, до 00:30 сидел на стойке».'],['p','Лиля фон Дорн','«С 22:40 была в 307-м. Звонила в Москву почти до полуночи».'],['p','Бруно Кайзер','«Закрыл кухню в 23:00, потом курил у чёрного хода. Один».'],['p','Аглая Северина','«Пела до 23:45. Тео сидел у сцены всё выступление».'],['p','Тео Марш','«С 23:00 до 00:30 был в баре. В 00:05 видел, как Вельман шёл к лестнице».'],['p','Ночная горничная','«В 23:15 слышала глухой удар со стороны кабинета. Решила — ставня».'],['u','Пепельница у чёрного хода','Три окурка одной марки. Бруно курит именно эти.'],['d','Телефонный журнал','Звонок из 307 в Москву: 22:41–23:52. Подтверждено оператором.'],['d','Кассовая книга','Сходится до копейки. Подписи Марты в 23:00 и 00:10.'],['d','Иск о взыскании','Вельман подал иск к Тео Маршу: долг 2,4 млн и изъятие доли. Слушание в понедельник.'],['d','Расписка','Тео занял у Вельмана под залог доли в консьерж-службе. Срок истёк месяц назад.'],['u','След на ковре кабинета','Подошва 43 размера с редким протектором. У Тео ботинки именно такие.'],['e','Экспертиза ключа','В щелях бронзового ключа кровь Вельмана. Выступ совпадает с формой раны.'],['u','Ведро котельной','Пусто, кроме ключа. Дно вытерто насухо тряпкой с хлоркой.'],['d','Журнал уборки','Хлорку в котельной берёт только консьерж. Выдача 22:50, подпись Тео.'],['p','Бруно Кайзер, повторно','«В 23:20 видел Тео у служебного коридора. Сказал — идёт за бельём».'],['m','Служебный коридор','Отсюда две двери: кабинет и котельная. В бельевую — только через лестницу.'],['p','Аглая Северина, повторно','«Тео уходил минут на двадцать, примерно с 23:10. Я пела, не смотрела».'],['d','Барный счёт Тео','Открыт в 22:30. Между 23:05 и 23:35 — ни одного заказа.'],['u','Ключ от котельной','Висит на гвозде в кабинете консьержа. Доступ свободный.'],['p','Оскар Гиль, повторно','«Тело я увидел в 00:10 и вызвал полицию. Тео стоял рядом. В 00:05 Вельмана уже не было живым».'],['e','Второй осмотр часов','Стрелки согнуты вручную: механизм остановили, а стекло разбили уже потом.'],['u','Тряпка в кармане пальто','Влажная, с хлоркой и бурыми пятнами. Пальто висит в кабинете консьержа.']],
q:[['Кто убил Вельмана?',[0,1,2,3,4,5],5],['Чем нанесли удар?',['Бронзовый ключ-мастер','Канделябр','Нож для льда','Портьерный шнур','Бутылка из погреба'],0],['Где произошло убийство?',[0,1,2,3,4,5],1],['Каков мотив?',['Долг и иск об изъятии доли','Ревность к наследнице','Украденный рецепт','Контракт с турфирмой','Месть за увольнение'],0],['Зачем разбили часы?',['Чтобы сдвинуть время смерти на 00:05','Чтобы разбудить постояльцев','Случайно при падении','Чтобы скрыть отпечатки','Часы были уликой против Марты'],0]],
sol:'Тео Марш убил Вельмана в кабинете около 23:20 бронзовым ключом-мастером, затем перетащил тело на лестницу, остановил и разбил часы, чтобы все решили, будто смерть наступила в 00:05 — когда у него уже было алиби в баре. Ключ он вымыл хлоркой и бросил в ведро котельной, куда имел доступ только он.',
ch:['Крови на лестнице нет, а пятно волочения идёт из кабинета — убийство было в кабинете, тело перенесли (карты 3, 4).','Часы показывают 00:05, но стрелки согнуты вручную, а врач даёт 23:20 — время подделано (карты 1, 2, 29).','Аглая и сам Тео утверждают, что он не выходил из бара, но её вторые показания и барный счёт дают двадцатиминутное окно с 23:10 (карты 11, 12, 25, 26).','Бруно видел Тео в служебном коридоре в 23:20 — оттуда двери только в кабинет и котельную, не в бельевую (карты 23, 24).','Ключ-мастер пропал из связки, найден в котельной, кровь в щелях совпадает с раной; хлорку берёт только консьерж, тряпка — в его пальто (карты 5, 6, 20, 21, 22, 30).','Иск и расписка дают мотив: в понедельник Тео терял долю (карты 17, 18).']},

{k:'train',t:'Купе номер четыре',d:3,lim:8,v:['Игорь Ланге','коммерсант'],
in:'Скорый «Северный» идёт ночь. На станции Тихвин в купе №4 нашли мёртвым коммерсанта Ланге. Поезд стоял восемь минут. Состав не покидал никто — но окно купе приоткрыто.',
s:[['Вера Сотник','проводница','Восемь лет на этом маршруте. Знает каждую уловку пассажиров.'],['Пётр Гвоздь','инженер, попутчик','Ехал в купе с Ланге. Всю дорогу спорил о патентах.'],['Алла Ким','фармацевт','Везла образцы в холодильнике. Аптечка при ней.'],['Роман Дых','начальник поезда','Отвечает за состав и за всё, что в нём происходит.'],['Тимур Ос','повар вагона-ресторана','Работает до полуночи. Потом спит в служебке.'],['Лиза Мант','студентка','Возвращается с конференции. Спала в соседнем купе.']],
pl:['Купе №4','Тамбур','Вагон-ресторан','Служебное купе','Перрон Тихвина','Купе №5'],
c:[['e','Заключение врача','Смерть от инъекции в шею, между 23:40 и 23:55. След иглы свежий, жертва не сопротивлялась.'],['m','Купе №4','Окно приоткрыто на два пальца. Пломба на раме сорвана и висит на нитке.'],['e','Пломба окна','Пломбу сорвали изнутри вагона: нитка натянута внутрь, а не наружу.'],['u','Шприц в тамбуре','Пустой шприц без иглы найден под раковиной тамбура. Отпечатков нет.'],['d','Опись аптечки','В аптечке Аллы Ким не хватает одного шприца и ампулы миорелаксанта.'],['p','Алла Ким','«Аптечку открывала в 23:30 при проводнице. Пересчитала — всё было. Потом ушла в ресторан».'],['p','Вера Сотник','«В 23:30 проверяла аптечку с Аллой — всё на месте. С 23:35 до 00:10 была в служебке с Романом».'],['p','Роман Дых','«С 23:35 до 00:10 оформлял документы с Верой. Потом обошёл вагоны».'],['p','Пётр Гвоздь','«Вышел на перрон в Тихвине покурить в 23:38. Вернулся, когда поезд тронулся».'],['p','Тимур Ос','«Закрыл ресторан в 23:00, лёг в служебке. Спал один, подтвердить некому».'],['p','Лиза Мант','«Проснулась в 23:45 от хлопка двери. Видела в коридоре мужчину в тёмном пальто — ушёл в тамбур».'],['d','Стоянка в Тихвине','Поезд стоял с 23:38 до 23:46. Двери вагонов открыты, но тамбурные двери заблокированы снаружи дежурным.'],['d','Журнал дежурного по станции','Тамбурные двери состава №41 были опломбированы на стоянке. Никто не мог войти или выйти через тамбур.'],['u','Окурок на перроне','Один окурок у вагона №4. Марка «Север». Пётр курит именно эти.'],['e','Экспертиза окурка','Окурок лежал под навесом платформы. Табак сухой, бумага не размокла. Точное время броска не установить.'],['d','Патентная заявка','Ланге подал заявку на тормозную систему за неделю до поездки. Соавтор — Гвоздь, но его имя вычеркнуто.'],['d','Письмо Гвоздя','«Ты вычеркнул меня из заявки. В Тихвине мы поговорим иначе». Отправлено за два дня.'],['u','Пальто в купе №4','Тёмное пальто Петра висит на крючке. Манжета влажная, на ней след машинного масла.'],['m','Тамбур вагона №4','Раковина, мусорный бак. Из тамбура можно попасть в купе и в служебку, но не на перрон при пломбах.'],['d','Служебный журнал вагона','Вера и Роман подписали акты в 23:35 и 00:10. Между этими подписями они были вместе.'],['p','Вера Сотник, повторно','«Аптечка стояла в моём купе. Ключ был у меня и у пассажира, который попросил таблетку. Я дала ключ Петру в 23:32».'],['u','Ключ от аптечки','Найден в кармане пальто Петра. На бородке — свежая царапина.'],['d','Ресторанный счёт','Алла Ким ужинала с 23:35 до 00:05, счёт подписан официантом поминутно.'],['p','Тимур Ос, повторно','«В 23:50 кто-то прошёл по коридору к тамбуру. Я подумал — проводница».'],['e','Второй осмотр купе','На столике — два стакана. В одном остатки чая, в другом ничего. Второй стакан вытерт.'],['u','Салфетка с пятном','В мусоре купе — салфетка со следом ампулы. Стекло ампулы найдено в кармане пальто.'],['d','Билет Лизы Мант','Место в купе №5, конференция в Тихвине. Возвращалась тем же поездом.'],['p','Лиза Мант, повторно','«Пальто было именно тёмное, с блестящей пуговицей. У Петра на пальто такие пуговицы».'],['e','Экспертиза ампулы','Остатки в ампуле — миорелаксант из аптечки Аллы. Доза смертельная при инъекции.'],['u','Пломба в мусоре тамбура','Сорванная пломба тамбурной двери брошена в бак тамбура — то есть кто-то сорвал её уже после стоянки, изнутри.']],
q:[['Кто убил Ланге?',[0,1,2,3,4,5],1],['Чем?',['Инъекция миорелаксанта','Удушение','Яд в чае','Удар ключом','Толчок из окна'],0],['Где произошло убийство?',[0,1,2,3,4,5],0],['Мотив?',['Вычеркнутое соавторство в патенте','Кража образцов','Долг за билет','Месть за увольнение','Ревность'],0],['Зачем сорвали пломбу окна?',['Чтобы изобразить, будто убийца пришёл с перрона','Чтобы выветрить запах','Чтобы выбросить тело','Случайно от сквозняка','Чтобы позвать проводницу'],0]],
sol:'Пётр Гвоздь взял у проводницы ключ от аптечки в 23:32, вынул шприц и ампулу, сделал Ланге инъекцию в купе между 23:40 и 23:55, вытер второй стакан и спрятал стекло ампулы в пальто. Он сорвал пломбу окна изнутри, чтобы решили, будто убийца проник с перрона, и сам «выходил покурить» — но окурок не датируется, а тамбурные двери были опломбированы станцией.',
ch:['Смерть от инъекции, в аптечке не хватает шприца и миорелаксанта (карты 1, 4, 5, 29).','Алла подтвердила аптечку при Вере в 23:30 и была в ресторане до 00:05 — доступ к аптечке после этого имел только тот, у кого ключ (карты 5, 6, 23).','Вера отдала ключ Петру в 23:32; ключ найден в его пальто со свежей царапиной (карты 21, 22).','Пётр утверждает, что был на перроне, но тамбурные двери опломбированы станцией, а сорванная пломба лежит в баке внутри вагона (карты 12, 13, 30).','Окурок на перроне — ложный след: время броска не установлено, он мог лежать там с прошлых поездов (карты 14, 15).','Лиза видела тёмное пальто с блестящей пуговицей, стекло ампулы — в пальто Петра; письмо и патент дают мотив (карты 11, 16, 17, 26, 28).']},

{k:'theater',t:'Софит на колосниках',d:2,lim:9,v:['Марк Ланской','режиссёр'],
in:'Прогон шёл полным ходом, когда софит сорвался с колосников и убил режиссёра на сцене. Трос не оборвался — его перепилили. Шестеро были в театре, и никто не покидал здание.',
s:[['Изабель Мор','примадонна','Двадцать лет на этой сцене. Роль собирался отдать молодой.'],['Густав Лемке','директор','Считает деньги, не искусство. Театр в долгах.'],['Рита Валь','костюмерша','Знает все швы, шнуры и романы труппы.'],['Феликс Арно','молодой премьер','Талантлив и голоден. Четвёртый год на вторых ролях.'],['Соня Дель','суфлёрша','Слышит всё из будки. Помнит разговоры лучше текста.'],['Ян Кречмер','осветитель','Ходит по колосникам как кошка. Брат погиб на монтаже три года назад.']],
pl:['Сцена','Колосники','Осветительская','Костюмерная','Суфлёрская будка','Кабинет директора'],
c:[['e','Трос софита','Не оборван: на срезе ровные насечки напильника. Работали вручную, минут десять.'],['e','Частицы на срезе','В насечках — латунная стружка. Латунь в театре есть только в осветительской: там паяют контакты.'],['m','Колосники','Пыль на решётке стёрта в двух местах: кто-то стоял и опирался. Отпечаток ладони на тросе.'],['e','Отпечаток на тросе','Отпечаток совпадает с Яном Кречмером. Он допускался к монтажу по должности.'],['p','Ян Кречмер','«Поднимался на колосники в 18:00, проверить лампы. Трос не трогал. С 19:00 был на пульте».'],['p','Изабель Мор','«С 19:00 гримировалась. Рита была со мной до самого выхода».'],['p','Рита Валь','«Гримировала Изабель с 19:00 до 19:50. Потом ушла за шнуром в костюмерную».'],['p','Густав Лемке','«С 18:30 до 20:00 в кабинете с бухгалтером. Проверяли страховку».'],['p','Феликс Арно','«Учил текст в будке с Соней до 19:40. Потом пошёл на сцену».'],['p','Соня Дель','«Феликс был в будке до 19:40. Слышала, как наверху кто-то работал — думала, Ян по лампам».'],['u','Напильник','Найден в осветительской на верстаке. На полотне — латунь и стальная пыль.'],['d','Журнал монтажных работ','Подъём на колосники записан за Яном в 18:00 и в 19:20. Вторая запись сделана другой рукой.'],['e','Экспертиза журнала','Запись «19:20» дописана позже: чернила свежее, нажим иной. Автор — не Ян.'],['p','Соня Дель, повторно','«Наверху работали около 19:25. Металлический звук, ровный, как пилят. Минут десять».'],['d','Дело о несчастном случае','Три года назад на монтаже погиб брат Яна. Акт подписала комиссия, но заключение режиссёра Ланского закрыло дело как «нарушение самим погибшим».'],['u','Копия акта у Яна','В шкафчике осветителя — копия акта с пометками: «Он знал, что трос был бракованный».'],['d','Страховой полис театра','Оформлен весной, выгодоприобретатель — директор. Но выплата при гибели режиссёра идёт театру, не лично Лемке.'],['d','Приказ о роли','Ланской подписал приказ: главную роль отдать Феликсу. Изабель узнала за час до прогона.'],['p','Изабель Мор, повторно','«Я была в ярости. Но я не пилю тросы — я пою. И Рита не отходила от меня».'],['m','Осветительская','Верстак, паяльник, бухты кабеля, ящик с латунными контактами. Ключ висит на пульте, доступен всем.'],['u','Латунная стружка на полу','Дорожка стружки тянется от верстака к двери и дальше — к лестнице на колосники.'],['p','Рита Валь, повторно','«В 19:30 видела Яна у лестницы с чем-то в руке. Он сказал — меняет лампу».'],['d','Складской журнал','Лампы выданы Яну в 17:50. Все шесть целых, ни одна не менялась.'],['e','Время падения','Софит упал в 19:52. Трос с учётом нагрева держит после пропила около получаса.'],['p','Густав Лемке, повторно','«Бухгалтер был со мной всё время. Я не выходил. Проверяйте бумаги».'],['u','Перчатки Яна','На перчатках латунная пыль и след машинного масла с троса.'],['d','Табель прогона','Все шестеро отмечены в театре с 17:00. Никто не выходил до 20:30.'],['p','Феликс Арно, повторно','«Ян весь день был странный. Сказал мне: сегодня спектакль закончится раньше».'],['e','Второй осмотр среза','Пропил сделан так, чтобы трос держал до нагрузки — расчёт на конкретный момент прогона.'],['u','Записка в кармане Яна','«Ты подписал, что он сам виноват. Сегодня ты подпишешь другое».']],
q:[['Кто перепилил трос?',[0,1,2,3,4,5],5],['Как было совершено убийство?',['Пропиленный трос софита','Удар рапирой','Яд в глинтвейне','Толчок в оркестровую яму','Подменённые капли'],0],['Где готовили убийство?',[0,1,2,3,4,5],2],['Мотив?',['Месть за брата и подлог в акте','Страховка театра','Главная роль','Долги театра','Украденный текст пьесы'],0],['Зачем дописали запись в журнале?',['Чтобы сдвинуть подъём на 18:00 и укрыть работу в 19:25','Чтобы скрыть выдачу ламп','Чтобы подставить Риту','Чтобы оправдать страховку','Чтобы отменить прогон'],0]],
sol:'Ян Кречмер поднялся на колосники около 19:25 и напильником из осветительской сделал пропил, рассчитанный на нагрузку в 19:52. Латунная стружка на срезе, на полу, на перчатках и дорожка к лестнице ведут к нему. Запись «19:20» в журнале он дописал другой рукой, чтобы казалось, будто работа была раньше. Мотив — гибель брата, которую Ланской закрыл как «вину самого погибшего».',
ch:['Трос перепилен напильником, в насечках латунь — она есть только в осветительской (карты 1, 2, 11).','Соня слышала пиление около 19:25 десять минут, Рита видела Яна у лестницы в 19:30 (карты 14, 22).','Запись «19:20» подделана, лампы не менялись — подъём был не по лампам (карты 12, 13, 23).','Стружка тянется от верстака к лестнице, перчатки Яна в латуни и масле, отпечаток на тросе его (карты 4, 21, 26).','Пропил рассчитан на 19:52 — это не случайность, а расчёт (карты 24, 29).','Акт о гибели брата, пометки и записка дают мотив; страховка идёт театру, а не Лемке (карты 15, 16, 17, 30).']},

c:[['e','Заключение токсиколога','В кофе профессора аконитин, смертельная доза. Принят около 22:30.'],['m','Лаборатория 214','Чашка на дальнем столе, кофе остыл. Сахар не размешан — значит, пили сразу.'],['d','Журнал выдачи реактивов','Аконитин выдан 22:10 под подпись «П. Данилов».'],['e','Почерковедческая экспертиза','Подпись «П. Данилов» подделана. Нажим и наклон совпадают с рукой Аси Верещагиной.'],['d','Билет и посадочный талон','Прохор Данилов улетел на конференцию в 18:40 того дня. Вернулся через два дня.'],['p','Прохор Данилов','«Я был в другом городе. Меня не было — проверьте билет. Подпись не моя».'],['p','Ася Верещагина','«Журнал вела как всегда. Реактив выдала Прохору в 22:10, он расписался при мне».'],['p','Вера Хмель','«С 22:00 до 23:30 сидела в читальном зале с Кирой. Готовили протокол».'],['p','Кира Ланге','«Вера была со мной всё время. Мы не выходили, кроме чая в 22:20».'],['p','Эдгар Бойм','«В кабинете с Тимуром до 23:00. Обсуждали бюджет гранта».'],['p','Тимур Гасанов','«Был у ректора с 21:40 до 23:00. Потом ушёл домой, пропуск это покажет».'],['d','Журнал пропусков','Тимур вышел в 23:04. Вера и Кира вошли в читальный зал в 21:55, вышли в 23:35.'],['u','Ключ лаборантской','Один экземпляр у Аси, второй — у ректора. Ключ ректора висел в кабинете весь вечер.'],['d','Инвентаризация ядов','Шкаф с ядами вскрывали дважды: в 17:00 (плановая) и в 22:10. Вторая подпись — Аси.'],['p','Ася Верещагина, повторно','«В 22:10 я была одна в лаборантской. Прохор... нет, я оговорилась. Я имела в виду — журнал заполняла одна».'],['d','Диссертация Аси','В архиве — работа Аси Верещагиной трёхлетней давности. Три главы совпадают с публикацией Гринёва.'],['u','Пометки Гринёва','На полях диссертации рукой Гринёва: «Плагиат. Готовлю представление в совет».'],['d','Проект представления','Гринёв подготовил документ о лишении Аси степени. Дата — понедельник.'],['p','Кира Ланге, повторно','«Ася приходила в читальный зал в 22:15 за диссертацией. Унесла её и вернула через десять минут».'],['m','Читальный зал','Из зала до лаборатории — две минуты. До лаборантской — три.'],['u','Чашка из лаборантской','В раковине лаборантской — вторая чашка со следом аконитина. Ополоснута, но не вымыта.'],['e','Экспертиза второй чашки','В чашке из лаборантской тот же аконитин. Значит, раствор готовили там.'],['p','Вера Хмель, повторно','«Ася приносила нам чай в 22:20. Она была в лаборантской, потом в зале. Больше никто не приносил».'],['d','График дежурств','В ночь дежурила только Ася. Остальные имели доступ по ключу ректора, но ключ не брали.'],['u','Перчатки в мусоре лаборантской','Латексные перчатки со следом аконитина внутри. Размер S — Аси носит S.'],['p','Эдгар Бойм, повторно','«Мой ключ висел в кабинете. Тимур это подтвердит. Я не выходил до 23:00».'],['p','Тимур Гасанов, повторно','«Ключ висел. Я видел его, когда входил и когда выходил».'],['d','Публикация Гринёва','Статья вышла под его именем. Соавторы не указаны. Оригинал — работа Аси.'],['e','Сопоставление текстов','Три главы совпадают дословно, включая опечатки. Автор оригинала — Ася.'],['u','Записка Аси в кармане халата','«В понедельник меня лишат всего. Он не доживёт до совета».']],
q:[['Кто отравил Гринёва?',[0,1,2,3,4,5],2],['Чем?',['Аконитин в кофе','Инъекция','Ток','Удар бюстом','Яд в ампуле'],0],['Где готовили раствор?',[0,1,2,3,4,5],1],['Мотив?',['Плагиат её работы и лишение степени','Грант на миллион','Место на кафедре','Доступ к архиву','Процент куратора'],0],['Зачем подделали подпись аспиранта?',['Чтобы увести подозрение на того, кто в отъезде','Чтобы скрыть выдачу реактива','Чтобы подставить Веру Хмель','Чтобы оправдать ректора','Чтобы запутать дату выдачи'],0]],
sol:'Ася Верещагина отравила профессора Гринёва аконитином в кофе. Раствор она готовила в лаборантской, где осталась вторая чашка со следом яда. В журнале выдачи она подделала подпись аспиранта Данилова, зная, что тот в отъезде и не сможет подтвердить выдачу. Мотив — плагиат: Гринёв собирался лишить её степени за украденные главы диссертации.',
ch:['Смерть от аконитина в кофе около 22:30, сахар не размешан — пили сразу (карты 1, 2).','Подпись Данилова подделана, а сам он в отъезде с 18:40 — выдать реактив не мог (карты 3, 4, 5, 6).','Ася одна в лаборантской в 22:10; вторая чашка со следом яда и перчатки размера S — раствор готовили там (карты 7, 20, 21, 24).','Ася забрала диссертацию в 22:15 и вернула через десять минут; ключ ректора не брали, дежурила только Ася (карты 11, 14, 18, 23).','Ключ ректора висел в кабинете, Тимур подтверждает; в ночь дежурила только Ася (карты 12, 23, 25, 26).','Мотив: плагиат в диссертации, представление в совет в понедельник, записка «он не доживёт до совета» (карты 15, 16, 17, 27, 28, 29, 30).']}

var G={phase:'menu',players:[],cd:null,hands:[],handIdx:0,votes:[],vp:0,qi:0};

function render(){
  var app=$('#app');if(!app)return;
  var v=app.querySelector('.v');
  if(!v){app.innerHTML='<div class="v"></div>';v=app.querySelector('.v');}
  var f={menu:menu,setup:setup,deal:deal,discuss:discuss,vote:vote,reveal:reveal}[G.phase];
  if(f)f(v);
}
function gTo(p){G.phase=p;render();}
function gStart(n){
  auInit();
  G.players=[];for(var i=0;i<n;i++)G.players.push({name:'Игрок '+(i+1),score:0});
  G.cd=CASES[ri(CASES.length)];
  var idx=G.cd.c.map(function(_,i){return i;});shuf(idx);
  G.hands=[];for(var i=0;i<n;i++)G.hands.push([]);
  idx.forEach(function(ci,i){G.hands[i%n].push(ci);});
  G.votes=[];for(var i=0;i<n;i++)G.votes.push({a:[]});
  G.handIdx=0;G.vp=0;G.qi=0;
  G.phase='deal';sfx('deal');render();
}
function menu(v){
  var n=CASES.length;
  v.innerHTML='<div class="hero"><svg width="72" height="72" viewBox="0 0 32 32"><rect x="4" y="3" width="15" height="21" rx="2" fill="#e0a33c" transform="rotate(-7 11 13)"/><rect x="11" y="6" width="15" height="21" rx="2" fill="#d6414d" transform="rotate(5 18 16)"/><circle cx="18" cy="14" r="4" fill="none" stroke="#0d1017" stroke-width="1.6"/><path d="M21 17l4 4" stroke="#0d1017" stroke-width="1.8" stroke-linecap="round"/></svg><h1>ЭЛЕМЕНТАРНО</h1><div class="sb">'+n+' '+pl(n,['дело','дела','дел'])+'</div><p>Детективная игра. Раздайте карты, найдите убийцу, ответьте на вопросы.</p></div>'+
    '<button class="btn ba" onclick="game.to(\'setup\')">Начать игру</button>'+
    '<button class="btn bg2" onclick="game.snd()">Звук: '+(AU.on?'вкл':'выкл')+'</button>'+
    '<div class="di ct" style="margin-top:8px">Одно устройство · 1–6 игроков</div>';
}
function setup(v){
  var h='<div class="hero"><h2>Сколько игроков?</h2><p>Карты раздаются поровну. Каждый смотрит свои карты, затем все обсуждают и голосуют.</p></div><div class="opts g2">';
  for(var i=1;i<=6;i++)h+='<button class="opt" onclick="game.start('+i+')"><span class="ix">'+i+'</span><span class="ol">'+i+' '+pl(i,['игрок','игрока','игроков'])+'</span></button>';
  h+='</div><button class="lnk" onclick="game.to(\'menu\')">Назад</button>';
  v.innerHTML=h;
}
function cardHTML(card){
  var t=TY[card[0]];
  return '<div class="card" style="'+tv(t.c)+'"><div class="ch"><div class="ci">'+ic(card[0],18)+'</div><div class="gr"><div class="ct2">'+E(card[1])+'</div><div class="ck">'+t.n+'</div></div></div><div class="cx">'+E(card[2])+'</div></div>';
}
function deal(v){
  var p=G.players[G.handIdx],hand=G.hands[G.handIdx];
  var h='<div class="pan ct"><div class="se" style="font-size:20px">'+E(p.name)+'</div><div class="mu">Ваши карты. Другим не показывайте.</div></div><div class="hand">';
  hand.forEach(function(ci){h+=cardHTML(G.cd.c[ci]);});
  h+='</div><div class="abar"><button class="btn ba" onclick="game.nextHand()">'+(G.handIdx<G.players.length-1?'Запомнил, передать':'Все посмотрели — к обсуждению')+'</button></div>';
  v.innerHTML=h;
}
function gNextHand(){
  if(G.handIdx<G.players.length-1){G.handIdx++;sfx('deal');render();}
  else{G.phase='discuss';sfx('turn');render();}
}
function discuss(v){
  var h='<div class="vd"><div class="k">ДЕЛО</div><h2>'+E(G.cd.t)+'</h2><p>'+E(G.cd.in)+'</p></div>';
  h+='<div class="pan"><div class="tag c">Подозреваемые</div>';
  G.cd.s.forEach(function(s){h+='<div class="pers">'+face(s[0],48)+'<div class="gr"><div class="pn">'+E(s[0])+'</div><div class="pr2">'+E(s[1])+'</div><div class="pb">'+E(s[2])+'</div></div></div>';});
  h+='</div>';
  h+='<div class="pan"><div class="tag c">Места</div><div class="row wr" style="gap:6px;margin-top:8px">';
  G.cd.pl.forEach(function(p){h+='<span class="tag">'+E(p)+'</span>';});
  h+='</div></div>';
  h+='<div class="abar"><button class="btn ba" onclick="game.to(\'vote\')">Перейти к голосованию</button></div>';
  v.innerHTML=h;
}
function optText(q,o){
  if(typeof o!=='number')return o;
  if(/кто/i.test(q[0])&&o<G.cd.s.length)return G.cd.s[o][0];
  if(o<G.cd.pl.length)return G.cd.pl[o];
  return String(o);
}
function vote(v){
  var p=G.players[G.vp],q=G.cd.q[G.qi],vt=G.votes[G.vp];
  var h='<div class="pan ct"><div class="mu">'+E(p.name)+' · вопрос '+(G.qi+1)+' из '+G.cd.q.length+'</div></div>';
  h+='<div class="qp">'+E(q[0])+'</div><div class="opts">';
  q[1].forEach(function(o,i){
    h+='<button class="opt'+(vt.a[G.qi]===i?' on':'')+'" onclick="game.sel('+i+')"><span class="ix">'+String.fromCharCode(65+i)+'</span><span class="ol">'+E(optText(q,o))+'</span></button>';
  });
  h+='</div><div class="abar"><button class="btn ba" '+(vt.a[G.qi]===undefined?'disabled':'')+' onclick="game.nextVote()">'+((G.qi<G.cd.q.length-1)?'Дальше':(G.vp<G.players.length-1?'Передать игроку':'Результаты'))+'</button></div>';
  v.innerHTML=h;
}
function gSel(i){G.votes[G.vp].a[G.qi]=i;sfx('tap');render();}
function gNextVote(){
  if(G.qi<G.cd.q.length-1){G.qi++;render();}
  else if(G.vp<G.players.length-1){G.vp++;G.qi=0;render();}
  else{G.phase='reveal';sfx('win');render();}
}
function reveal(v){
  var h='<div class="vd"><div class="sm seal">Дело раскрыто</div><div class="k">РЕШЕНИЕ</div><h2>'+E(G.cd.t)+'</h2><p>'+E(G.cd.sol)+'</p></div>';
  h+='<div class="pan"><div class="tag c">Цепочка улик</div>';
  G.cd.ch.forEach(function(line,i){h+='<div class="chain"><div class="cn2">'+(i+1)+'</div><div class="cx2">'+E(line)+'</div></div>';});
  h+='</div>';
  h+='<div class="pan"><div class="tag c">Результаты</div>';
  G.players.forEach(function(p,i){
    var sc=0;G.votes[i].a.forEach(function(ans,qi){if(ans===G.cd.q[qi][2])sc++;});
    p.score=sc;
    h+='<div class="lp"><div class="gr"><div class="ln">'+E(p.name)+'</div></div><div class="rl">'+sc+' / '+G.cd.q.length+'</div></div>';
  });
  h+='</div>';
  h+='<div class="abar"><button class="btn ba" onclick="game.start(G.players.length)">Новое дело</button><button class="btn bg2" onclick="game.to(\'menu\')">В меню</button></div>';
  v.innerHTML=h;
}
function gSnd(){auInit();setSnd(!AU.on);render();}

window.game={to:gTo,start:gStart,nextHand:gNextHand,sel:gSel,nextVote:gNextVote,snd:gSnd};

fxInit();
setTimeout(function(){window.__ok=true;render();},600);
})();
</script>
