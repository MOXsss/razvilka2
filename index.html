ет. Кадр 2: официантка ставит бокалы. Кадр 3: жених меняет два бокала местами."],["u","Кадр 3 крупно","Жених держит бокал «Гордей» и бокал «Лев». После кадра они стоят наоборот."],["p","Лев Жених","«Я поправлял бокалы, чтобы не путались. Не менял местами»."],["p","Ася Невеста","«Отец за час до банкета сказал, что брак фиктивный и он его отменит. Я была в шоке»."],["p","Нина Тёща","«Ссорилась с мужем весь вечер. Но я не травлю — я хотела развода, не смерти»."],["d","Брачный договор","По договору при отмене брака жених не получает ничего. При смерти тестя невеста наследует, и имущество становится общим."],["u","Записка тестя","«Брак фиктивный. Утром иду к нотариусу и отменяю всё». Найдена в его пиджаке."],["p","Лев Жених, повторно","«Я не знал про записку. Отец... тесть мне ничего не говорил»."],["p","Стас Фото, повторно","«Я показал кадры Асе. Она сказала, что Лев поправлял бокалы. Но на кадрах он именно меняет их»."],["d","Список рассадки","Бокал «Гордей» стоял слева от центра. После перестановки — справа, где сидел жених."],["u","Флакон в кармане жениха","Пустой флакон с растительным алкалоидом. Найден в курительной, в его пиджаке."],["e","Экспертиза флакона","Тот же алкалоид, что в бокале. Флакон из аптеки, где работает друг жениха."],["d","Аптечная запись","Флакон выдан другу жениха за день до свадьбы. Друг подтвердил, что отдал Льву."],["p","Друг жениха (по телефону)","«Я отдал Льву флакон. Он сказал — для крыс на даче»."],["m","Курительная","От президиума до курительной — минута. Жених выходил туда дважды за вечер."],["d","Журнал выходов","Фотограф снял, как жених выходит в курительную в 19:40 и 20:10. Тост в 20:20."],["p","Оля Фужер, повторно","«Я ставила бокалы по наклейкам. После меня их никто не трогал, кроме жениха — я видела на фото»."],["p","Марк Тама, повторно","«Я наливал из одной бутылки. Если бы яд был в бутылке, легли бы все»."],["u","Пробка бутылки","Бутылка проверена: остаток вина чистый. Яд не в вине."],["e","Следы на бокале","На бокале «Гордей» — отпечатки жениха поверх отпечатков официантки."],["p","Нина Тёща, повторно","«Я видела, как Лев что-то капал в бокал в курительной. Думала — лекарство от головы»."],["u","Салфетка в курительной","Салфетка со следом алкалоида. Брошена в урну курительной в 20:10."],["u","Записка жениха","«Он отменит утром. Тогда я останусь ни с чем. Сегодня он выпьет за нас»."]],"q":[["Кто отравил бокал?",[4,3,0,5,2,1],2],["Как?",["Инъекция","Яд в еду","Яд в конкретный бокал","Яд в бутылку","Яд в воздух"],2],["Где отравили бокал?",[0,4,2,5,1,3],3],["Мотив?",["Наследство дочери","Долг тамады","Месть тёщи","Тесть отменял фиктивный брак и лишал жениха всего","Ссора официантки"],3],["Что выдало перестановку бокалов?",["Журнал выходов","Наклейки на днищах","Слова тёщи","Покадровая съёмка фотографа","Отпечатки на бокале"],3]],"sol":"Лев Жених капнул алкалоид в бокал тестя в курительной в 20:10, а за столом поменял подписанные бокалы местами, чтобы отравленный оказался у жертвы. Покадровая съёмка зафиксировала перестановку, отпечатки жениха поверх отпечатков официантки, флакон из аптеки друга и салфетка в курительной. Мотив — тесть утром отменял фиктивный брак.","ch":["Яд только в бокале жертвы, бутылка чистая — отравили конкретный бокал (карты 1, 2, 3, 25).","Бокалы подписаны; на кадре 3 жених меняет два бокала местами (карты 6, 8, 9).","Жених отрицает перестановку, но рассадка и отпечатки поверх официантки подтверждают (карты 10, 15, 26).","Флакон с тем же ядом в его пиджаке, выдан другом, салфетка в курительной (карты 17, 18, 19, 20, 29).","Тёща видела, как он капал в курительной; выходы сняты фотографом (карты 21, 22, 28).","Записка тестя, брачный договор и записка жениха дают мотив (карты 13, 14, 30)."]},{"k":"regatta","t":"Гик на повороте","d":3,"lim":8,"v":["Марк Лот","капитан регаты"],"in":"Капитан мёртв на палубе после поворота у буя. Удар гиком. Все решили — несчастный случай при ветре. Но ветер в тот момент был слабый, а гик ходил сам.","s":[["Олег Шкипер","соперник","Шёл вторым. Дисквалификация из-за протеста Лота."],["Ирина Ветр","штурман","Считала курс. Знала ветер поминутно."],["Пётр Гик","матрос","Работал со шкотами. Единственный на палубе с капитаном."],["Соня Узел","боцман","Вязала узлы. Проверяла снасти утром."],["Марк Мотор","механик","Был в машинном отделении."],["Юля Флаг","судья","На судейском катере. Фиксировала нарушения."]],"pl":["Палуба","Кокпит","Машинное отделение","Судейский катер","Нос","Причал"],"c":[["e","Заключение врача","Смерть от удара гиком по голове. Удар сильный, направлен сверху вниз."],["m","Палуба","Кровь у грот-мачты. Гик в рабочем положении, шкот затянут наглухо."],["e","Метеосводка","В момент поворота ветер 3 узла. При таком ветре гик не может ударить с такой силой сам."],["u","Шкот грота","Затянут наглухо и зафиксирован дополнительным узлом. Такой узел не вяжут при работе."],["e","Экспертиза узла","Узел — «удавка с обратным ходом», редкий. Вяжут боцманы и те, кто служил на флоте."],["d","Журнал снастей","Снасти проверены утром Соней Узел. Все шкоты свободны, узлов нет."],["p","Соня Узел","«Проверяла снасти в 08:00. Шкоты свободны. Я не вяжу удавку — это не наш узел»."],["p","Пётр Гик","«Держал шкот по команде капитана. В момент поворота отпустил, как всегда»."],["p","Олег Шкипер","«Шёл вторым, был на своей яхте. Катер судьи это подтвердит»."],["p","Ирина Ветр","«Считала курс. Ветер 3 узла, я записала. Гик не мог ударить сам»."],["p","Марк Мотор","«Был в машинном отделении с 13:00 до 15:00. Один, но двигатель писал параметры»."],["p","Юля Флаг","«Фиксировала нарушения. Видела, как на яхте Лота кто-то тянул шкот вручную»."],["d","Судейская запись","В 14:12 на яхте Лота зафиксировано «ручное вмешательство в шкот». Судья не увидела кто."],["u","Фото с катера","На снимке — рука в тёмной перчатке тянет шкот. Перчатка с флотской нашивкой."],["e","Экспертиза перчатки","Нашивка — флотский курсантский выпуск. Пётр Гик окончил флотское училище."],["d","Личное дело Гика","Пётр Гик — выпускник флотского училища. Знает удавку с обратным ходом."],["u","Перчатка в рундуке","Тёмная перчатка с нашивкой найдена в рундуке Гика. На ней след смолы со шкота."],["d","Протест Лота","Лот подал протест против Олега Шкипера. Дисквалификация грозила Олегу."],["d","Решение протеста","Протест отклонён за час до гонки. Олег не дисквалифицирован."],["p","Олег Шкипер, повторно","«Протест отклонили, я шёл в гонке. Зачем мне убивать после победы в протесте?»"],["d","Письмо Гика","Лот списал Гика с флота за нарушение. Письмо об увольнении подписано Лотом."],["u","Копия письма у Гика","В рундуке Гика — копия письма с пометкой «Он выкинул меня с флота»."],["p","Ирина Ветр, повторно","«Пётр сказал, что капитан велел затянуть шкот наглухо. Но капитан такого не говорил — я слышала рацию»."],["d","Запись рации","Команды капитана записаны. Команды затянуть шкот наглухо нет."],["u","Дополнительный узел","Развязать удавку с обратным ходом можно за секунду — но её не развязали."],["e","Расчёт удара","При затянутом наглухо шкоте и повороте гик идёт по дуге с силой, достаточной для смертельного удара даже при слабом ветре."],["p","Пётр Гик, повторно","«Я затянул по команде. Капитан кричал. Рация могла не записать»."],["e","Проверка рации","Рация пишет все передачи без пропусков. Пропусков нет."],["m","Кокпит","От места Гика до шкота — полшага. Он единственный, кто мог затянуть незаметно."],["p","Юля Флаг, повторно","«Рука была в тёмной перчатке. У Гика такие. У Олега — белые, я видела»."],["u","Записка Гика","«Он кричал на меня последний раз. Сегодня он замолчит»."]],"q":[["Кто затянул шкот?",[1,4,2,5,3,0],2],["Как было совершено убийство?",["Яд","Удушение узлом","Удар в машинном отделении","Толчок за борт","Гик ударил из-за затянутого наглухо шкота"],4],["Где?",[3,0,5,1,2,4],1],["Мотив?",["Месть боцмана","Дисквалификация соперника","Долг механика","Лот списал его с флота","Спор о курсе"],3],["Почему версия несчастного случая неверна?",["Гик был сломан","Ветер 3 узла, гик не мог ударить сам; шкот затянут редким узлом","Капитан был пьян","Судья ошиблась","Волна ударила"],1]],"sol":"Пётр Гик завязал на шкоте удавку с обратным ходом и затянул его наглухо, из-за чего при повороте гик ударил капитана даже при ветре 3 узла. Команды затянуть шкот в рации нет, узел флотский, перчатка с нашивкой его училища и след смолы — в его рундуке. Мотив — Лот списал его с флота.","ch":["Ветер 3 узла — гик сам не ударит; шкот затянут наглухо редким флотским узлом (карты 3, 4, 5, 25).","Снасти утром свободны, боцман такой узел не вяжет (карты 6, 7).","Команды затянуть шкот в рации нет, запись без пропусков (карты 22, 24, 27).","Судья видела руку в тёмной перчатке с флотской нашивкой; перчатка со смолой в рундуке Гика, он выпускник училища (карты 12, 13, 14, 15, 16, 29).","Гик единственный у шкота (карты 8, 28).","Протест против Олега отклонён — ему убийство невыгодно; письмо Лота об увольнении даёт мотив Гику (карты 18, 19, 20, 21, 30)."]},{"k":"monastery","t":"Колокол в полночь","d":2,"lim":9,"v":["Отец Сергий","настоятель"],"in":"Настоятель мёртв на колокольне. Удар тяжёлым подсвечником. Колокол звонил в полночь, но звонарь клянётся, что не поднимался. На колокольне один ключ — у эконома.","s":[["Отец Климент","эконом","Продавал иконы через посредника. Единственный с ключом."],["Брат Иоанн","звонарь","Звонит по уставу. Клянётся, что не поднимался."],["Брат Лука","трапезник","Готовит братии. Уходит после ужина."],["Брат Фома","привратник","Сидит у ворот. Ведёт журнал посетителей."],["Брат Марк","писарь","Переписывает книги. Был в келье."],["Отец Павел","духовник","Принимал исповедь до 22:00."]],"pl":["Колокольня","Келья эконома","Трапезная","Привратня","Скрипторий","Храм"],"c":[["e","Заключение врача","Смерть от удара тяжёлым подсвечником, около 23:40. Один удар в затылок."],["m","Колокольня","Кровь у основания колокола. Подсвечник лежит рядом, кровь на нём."],["u","Подсвечник","Тяжёлый бронзовый подсвечник из храма. Отпечатки стёрты тканью."],["d","Журнал ключей","Ключ от колокольни один — у эконома. Дубликат у настоятеля, но он лежал в его келье."],["u","Ключ настоятеля","Найден в келье настоятеля на столе. Не использовался."],["p","Отец Климент","«С 23:00 до 00:30 был в келье, читал правило. Один. Никто не подтвердит»."],["p","Брат Иоанн","«Колокол звонил в полночь автоматически — я поставил механизм с вечера. Не поднимался»."],["e","Механизм колокола","Установлен таймер на полночь. Механизм исправен, звонил без человека."],["p","Брат Лука","«После ужина в 21:00 ушёл в келью. Трапезная заперта»."],["p","Брат Фома","«Сидел у ворот всю ночь. Журнал посетителей веду поминутно»."],["p","Брат Марк","«Был в скриптории до 23:00, потом в келье. Отец Павел видел, как я уходил»."],["p","Отец Павел","«Исповедь до 22:00, потом в храме убирал. Видел, как эконом шёл к колокольне в 23:30»."],["d","Журнал привратника","Никто не входил и не выходил с 22:00 до 06:00. Все шестеро внутри."],["u","Ткань с кровью","В келье эконома — ткань со следами крови и бронзовой патины."],["e","Экспертиза ткани","Кровь настоятеля, патина с подсвечника. Ткань — из облачения эконома."],["d","Книга продаж икон","Эконом продавал иконы через посредника. Записи в его книге."],["u","Письмо настоятеля","«Я отправлю опись в епархию в понедельник. Продажа икон — воровство»."],["d","Опись икон","Настоятель сверил опись: три иконы подменены копиями. Подписи эконома на актах."],["p","Отец Климент, повторно","«Я не выходил из кельи. Отец Павел ошибается — было темно»."],["p","Отец Павел, повторно","«Луна была полная. Я узнал эконома по походке и по чёткам в руке»."],["u","Чётки эконома","Найдены на колокольне, у основания колокола. Одна бусина расколота."],["e","Экспертиза чёток","Бусина расколота ударом о бронзу — в момент удара подсвечником."],["m","Расстояние","От кельи эконома до колокольни — три минуты. От храма — пять."],["p","Брат Иоанн, повторно","«Механизм я поставил в 20:00 при экономe. Он спросил, будет ли звон сам. Я сказал — да»."],["p","Отец Климент, трижды","«Я спрашивал про механизм из любопытства. Это не преступление»."],["d","Устав звонов","В полночь звонят вручную, кроме праздников. Тот день не праздник — автоматический звон нарушил устав."],["p","Брат Фома, повторно","«В 23:35 видел свет на колокольне. Думал — звонарь. Но звонарь был в трапезной со мной»."],["d","Трапезный журнал","Иоанн и Фома пили чай с 23:20 до 00:10. Записано Лукой."],["u","Записка эконома","«Он отправит опись. Тогда меня лишат сана и свободы»."],["e","Второй осмотр подсвечника","Подсвечник взят из храма: на нём воск того же состава, что на престоле. Ключ от храма — у эконома и духовника."],["p","Отец Павел, трижды","«Мой ключ от храма висел в ризнице всю ночь. Эконом брал свой ключ в 23:20 — я видел»."]],"q":[["Кто убил настоятеля?",[4,3,0,5,1,2],2],["Чем?",["Книга","Крест","Бронзовый подсвечник","Колокольный язык","Кадило"],2],["Где?",[4,0,3,1,5,2],1],["Мотив?",["Месть трапезника","Настоятель раскрыл подмену икон и готовил опись в епархию","Кража книг","Спор о звонах","Долг привратника"],1],["Почему звон колокола не даёт алиби?",["Звонил эконом","Звона не было","Звонил автоматический механизм, поставленный с вечера","Колокол звонил сам от ветра","Звонарь соврал"],2]],"sol":"Отец Климент взял подсвечник из храма своим ключом в 23:20, поднялся на колокольню по единственному ключу и убил настоятеля около 23:40. Он заранее выведал у звонаря про автоматический механизм, чтобы звон в полночь создал видимость, будто наверху кто-то есть. Чётки с расколотой бусиной, ткань с кровью и патиной из его облачения и слова духовника замыкают цепь.","ch":["Ключ колокольни один — у эконома; ключ настоятеля не использован (карты 4, 5).","Колокол звонил автоматически, звонарь был в трапезной с привратником (карты 6, 7, 8, 26, 27).","Духовник видел эконома у колокольни в 23:30 и с ключом храма в 23:20; полная луна (карты 12, 19, 20, 30).","Чётки эконома на месте удара, бусина расколота о бронзу; ткань с кровью и патиной из его облачения (карты 14, 15, 21, 22).","Он выведал про механизм заранее — подготовка алиби (карты 24, 25).","Книга продаж, подменённые иконы, письмо в епархию и записка дают мотив (карты 16, 17, 18, 28)."]},{"k":"data","t":"Холодный коридор","d":3,"lim":8,"v":["Илья Кул","инженер ЦОД"],"in":"Инженер мёртв в холодном коридоре дата-центра. Удушение кабельной стяжкой. Температура в коридоре упала до 8°C — кто-то включил аварийное охлаждение зоны, а затем вернул обычный режим. Журнал климата независим.","s":[["Герман Лис","начальник охраны","Единственный с мастер-бейджем на все зоны."],["Ева Рид","оператор мониторинга","Сидит за пультами. Видит все камеры."],["Кирилл Мазур","техник","Меняет диски. Носил стяжки в кармане."],["Нора Фальк","аудитор","Проверяла инвентарь. Ушла в 21:00."],["Дэн Хаас","сисадмин","Работал в горячем коридоре."],["Алина Штоль","менеджер","Уехала в 20:30."]],"pl":["Холодный коридор","Пульт мониторинга","Склад ЗИП","Пост охраны","Горячий коридор","Погрузочная"],"c":[["e","Заключение врача","Смерть от асфиксии, удавка кабельной стяжкой, около 22:20."],["m","Холодный коридор","Температура 8°C вместо 18. Стяжка на шее жертвы, затянута сзади."],["u","Кабельная стяжка","Стяжка нестандартная, с металлическим зубцом. Партия для охранного монтажа."],["d","Журнал климата","Независимый журнал: аварийное охлаждение зоны 4 включено в 22:05 и отключено в 22:40. Команда с пульта охраны."],["e","Проверка журнала","Журнал климата в отдельном контроллере. Стереть или подделать из системы нельзя."],["d","Журнал бейджей","В зону 4 входили: инженер в 21:50 и мастер-бейдж охраны в 22:03."],["p","Герман Лис","«Был на посту весь вечер. Мастер-бейдж не передавал. Камеры подтвердят»."],["p","Ева Рид","«Сидела на мониторинге. В 22:00 Герман выходил минут на тридцать. Сказал — обход»."],["p","Кирилл Мазур","«Менял диски в горячем коридоре с 21:30 до 23:00. Стяжки у меня обычные, пластиковые»."],["p","Нора Фальк","«Ушла в 21:00. Пропуск подтвердит»."],["p","Дэн Хаас","«Был в горячем коридоре с Кириллом. Мы работали вдвоём»."],["p","Алина Штоль","«Уехала в 20:30. Парковка подтвердит»."],["d","Парковочный журнал","Алина выехала в 20:33. Нора вышла в 21:02."],["d","Журнал обходов","Обход в 22:00 не отмечен. Отметки есть в 21:00 и 23:00."],["u","Стяжки на складе","Обычные пластиковые стяжки Кирилла лежат на складе ЗИП. Металлических нет."],["d","Накладная охранного монтажа","Партия стяжек с металлическим зубцом выдана охране. Подпись Лиса."],["u","Стяжка в ящике поста","В ящике поста охраны — упаковка тех же стяжек. Одна отсутствует."],["p","Ева Рид, повторно","«В 22:03 на камере видно, как Герман входит в зону 4. В 22:38 выходит. Я не хотела молчать»."],["e","Запись камеры","Камера зоны 4 пишет независимо. На 22:03 — Лис, на 22:38 — Лис. Инженер внутри всё время."],["p","Герман Лис, повторно","«Камера... я думал, она не пишет в холодном коридоре из-за конденсата»."],["d","Регламент камер","Камеры холодных коридоров в обогреваемых кожухах. Пишут всегда."],["u","Перчатка Лиса","В ящике поста — перчатка со следами металла стяжки и пота инженера."],["d","Инвентарная ведомость","Инженер готовил акт о пропаже шести серверов. Акт найден в его сумке."],["u","Акт о пропаже","Шесть серверов списаны как «вышедшие из строя», но серийники найдены в накладной на вывоз."],["d","Накладная на вывоз","Вывоз подписан охраной. Подпись Лиса. Получатель — фирма, зарегистрированная на его тестя."],["p","Нора Фальк, повторно","«Я проверяла инвентарь и нашла расхождение. Сказала инженеру. Он готовил акт»."],["m","Погрузочная","Вывоз серверов прошёл через погрузочную в 20:00. Камера пишет."],["e","Запись погрузочной","На записи Лис лично открывает ворота и подписывает накладную."],["p","Кирилл Мазур, повторно","«Дэн был со мной всё время. Мы не выходили. Стяжки мои — на складе, проверьте»."],["u","Записка Лиса","«Он подпишет акт. Тогда фирма всплывёт, а с ней я»."],["e","Сопоставление времени","Аварийное охлаждение включено в 22:05, вскоре после входа Лиса в 22:03. Инженер оказался в холодной зоне, чем Лис воспользовался для нападения."]],"q":[["Кто задушил инженера?",[0,2,4,5,1,3],0],["Чем?",["Ремень","Шнур бейджа","Кабель питания","Провод","Кабельная стяжка с металлическим зубцом"],4],["Где?",[1,0,5,3,2,4],1],["Мотив?",["Кража аудитора","Месть за увольнение","Спор о дисках","Долг менеджера","Инженер готовил акт о серверах, вывезенных через фирму тестя Лиса"],4],["Что изобличило убийцу вопреки его словам?",["Независимые журналы климата и камеры зоны 4","Стяжки на складе","Слова аудитора","Парковочный журнал","Показания Кирилла"],0]],"sol":"Герман Лис вошёл в зону 4 по мастер-бейджу в 22:03, включил аварийное охлаждение с пульта охраны, чтобы температура упала до 8°C, и задушил инженера стяжкой из охранной партии. Независимые журналы климата и камера зоны 4 фиксируют его вход и выход, хотя он утверждал, что не покидал пост. Мотив — акт о шести серверах, вывезенных через фирму его тестя.","ch":["Стяжка с металлическим зубцом из охранной партии, упаковка на посту, одна отсутствует (карты 3, 15, 16, 17).","Журнал климата независим: отключение в 22:05 с пульта охраны; бейдж Лиса в 22:03 (карты 4, 5, 6).","Лис заявляет, что не выходил, но Ева видела уход, обход в 22:00 не отмечен, камера пишет его вход и выход (карты 7, 8, 14, 18, 19, 20, 21).","Перчатка со следами металла и пота инженера на посту (карта 22).","Акт о пропаже, накладная на фирму тестя и запись погрузочной дают мотив (карты 23, 24, 25, 27, 28).","Кирилл и Дэн были вдвоём, стяжки обычные на складе; Алина и Нора уехали (карты 9, 10, 11, 12, 13, 15, 29)."]},{"k":"fair","t":"Карусель без заземления","d":1,"lim":10,"v":["Гриша Владелец","хозяин аттракциона"],"in":"Хозяин карусели мёртв у щитка. Ток. Заземление снято, рубильник включён вручную. Жетоны на карусель считаны — и один лишний.","s":[["Лев Электрик","электрик ярмарки","Единственный с ключом от щитка. Зарплату не платили три месяца."],["Оля Билет","кассир","Продаёт жетоны. Считает их поминутно."],["Марк Карусель","оператор","Крутит карусель. Был на платформе."],["Соня Слад","продавец ваты","Работает рядом. Видит всех."],["Стас Мотор","механик","Чинит приводы. Был у горки."],["Ира Плакат","зазывала","Стоит у входа. Считает посетителей."]],"pl":["Щиток карусели","Касса","Платформа карусели","Палатка ваты","Горка","Вход"],"c":[["e","Заключение врача","Смерть от электротравмы, около 21:30. Метка тока на правой ладони."],["m","Щиток карусели","Заземляющая шина снята. Рубильник включён вручную после отключения."],["u","Заземляющая шина","Откручена ключом на 13. Ключ такого размера — в наборе электрика."],["e","Экспертиза шины","На шине след масла и потожировой след Льва Электрика."],["d","Журнал ключей щитка","Ключ один — у электрика. Дубликат у владельца, но он лежал в кассе."],["u","Ключ владельца","Найден в кассе, в ящике под жетонами. Не использовался."],["p","Лев Электрик","«Был у горки со Стасом с 21:00 до 22:00. Чинили привод»."],["p","Стас Мотор","«Лев был со мной, но уходил минут на двадцать около 21:20. Сказал — за инструментом»."],["p","Оля Билет","«Считала жетоны. В 21:15 выдала партию, в 21:45 сверяла. Один жетон лишний»."],["p","Марк Карусель","«Крутил карусель без остановки с 21:00 до 22:00. Один лишний жетон — значит, кто-то пустил карусель вручную»."],["p","Соня Слад","«Видела, как Лев шёл к щитку в 21:25. Думала — проверять»."],["p","Ира Плакат","«Считала посетителей. В 21:30 карусель крутилась, но оператора на платформе не было»."],["d","Журнал оператора","Марк отмечал каждый запуск. В 21:30 запуска нет, но карусель работала."],["e","Механизм карусели","Карусель можно запустить вручную из щитка, минуя пульт оператора."],["u","Лишний жетон","Жетон с царапиной найден в кармане Льва. Такие жетоны — из партии кассира."],["d","Ведомость зарплаты","Льву не платили три месяца. Долг 180 тысяч. Владелец подписал отказ."],["u","Копия отказа у Льва","В его сумке — копия отказа с пометкой «Он не заплатит никогда»."],["p","Лев Электрик, повторно","«Я не уходил. Стас путает время»."],["p","Стас Мотор, повторно","«Не путаю. Я один чинил привод двадцать минут. Спросите Соню — она видела Льва у щитка»."],["m","Расстояние","От горки до щитка — три минуты. Двадцати минут хватает."],["u","Перчатка со следами","В сумке Льва — перчатка со следом масла шины и подгоревшим краем."],["e","Экспертиза перчатки","Подгоревший край — от искры при включении рубильника без заземления."],["p","Оля Билет, повторно","«Лишний жетон я не выдавала. Значит, кто-то взял из кассы. Ключ от кассы был у владельца и у меня»."],["d","Журнал кассы","Касса открывалась в 21:10 и 21:45. В 21:10 — почерк не Оли."],["e","Почерк журнала кассы","Запись в 21:10 сделана Львом: он расписывался в ведомости зарплаты теми же чернилами."],["p","Марк Карусель, повторно","«Я не запускал в 21:30. Карусель пошла сама — значит, из щитка»."],["p","Ира Плакат, повторно","«Владелец пошёл к щитку в 21:28, сказал — проверит, почему карусель крутится без жетона»."],["u","Записка Льва","«Он придёт проверять. Без заземления он не уйдёт»."],["e","Расчёт тока","Без заземления корпус щитка под напряжением. Прикосновение смертельно."],["p","Соня Слад, повторно","«Лев вернулся от щитка в 21:45. Руки в перчатках, хотя было тепло»."]],"q":[["Кто снял заземление?",[5,3,4,0,1,2],3],["Как было совершено убийство?",["Удар приводом","Удушение","Яд в вате","Ток от щитка без заземления","Падение с горки"],3],["Где?",[1,2,3,5,0,4],4],["Мотив?",["Кража жетонов","Месть кассира","Спор о карусели","Три месяца невыплаченной зарплаты и отказ","Долг механика"],3],["Зачем нужен был лишний жетон?",["Случайно","Чтобы подставить кассира","Чтобы запустить карусель и выманить владельца к щитку","Чтобы скрыть недостачу","Чтобы прокатиться"],2]],"sol":"Лев Электрик ушёл от горки в 21:20, взял жетон из кассы, запустил карусель из щитка, снял заземление ключом на 13 и включил рубильник. Владелец пошёл проверять, почему карусель крутится без жетона, и погиб от тока. След масла и пота на шине, перчатка с подгоревшим краем, его почерк в журнале кассы и лишний жетон в кармане замыкают цепь.","ch":["Смерть от тока, заземление снято ключом на 13 из набора электрика, след его пота и масла (карты 1, 2, 3, 4, 29).","Ключ щитка один у него, ключ владельца в кассе не использован (карты 5, 6).","Он заявляет алиби у горки, но Стас и Соня дают двадцатиминутный уход к щитку (карты 7, 8, 11, 18, 19, 20, 30).","Карусель в 21:30 работала без запуска оператора — значит, из щитка; лишний жетон у Льва, его почерк в кассе (карты 9, 10, 12, 13, 14, 15, 23, 24, 25).","Владелец пошёл к щитку проверять — его выманили (карты 27, 28).","Ведомость долга, отказ и записка дают мотив (карты 16, 17)."]},{"k":"clinic","t":"Капельница в шестой","d":3,"lim":8,"v":["Гордей Глав","главврач"],"in":"Главврач мёртв в палате 6, где лежал сам. В капельнице — калий вместо физраствора. Ампулы списаны как использованные, но журнал дежурств показывает, кто был в палате.","s":[["Ася Медь","медсестра","Дежурила в крыле. Год назад её ошибку скрыл главврач — за цену."],["Лев Хирург","хирург","Оперировал днём. Ушёл в 20:00."],["Оля Фарм","фармацевт","Выдаёт препараты. Ведёт журнал ампул."],["Марк Санит","санитар","Возит бельё. Был в крыле."],["Нора Тер","терапевт","Дежурила в другом крыле."],["Стас Амп","интерн","Помогал сестре. Путает ампулы."]],"pl":["Палата 6","Пост сестры","Аптечка крыла","Ординаторская","Коридор","Склад белья"],"c":[["e","Заключение врача","Смерть от гиперкалиемии, инъекция калия в капельницу, около 23:10."],["m","Палата 6","Капельница подключена. В пакете — калий, не физраствор."],["e","Экспертиза пакета","Концентрация калия смертельная. Физраствор в пакете отсутствует полностью."],["d","Журнал ампул","Калий списан как использованный в 22:50. Подпись «А. Медь»."],["e","Почерк подписи","Подпись подлинная, Аси Меди. Она не отрицает списание."],["p","Ася Медь","«Списала калий в 22:50 для пациента из второй палаты. В шестую не заходила с 22:00»."],["p","Лев Хирург","«Ушёл в 20:00 после операции. Пропуск подтвердит»."],["p","Оля Фарм","«Выдала калий Асе в 22:45 под подпись. Он был для второй палаты — там назначено»."],["p","Марк Санит","«Возил бельё по крылу с 22:30 до 23:30. Заходил в шестую в 23:00, главврач спал»."],["p","Нора Тер","«Дежурила в другом крыле. Ко мне обращались в 22:40 и 23:20»."],["p","Стас Амп","«Помогал Асе на посту. В 22:50 она уходила минут на пятнадцать»."],["d","Журнал дежурств","Ася на посту в 22:00, 22:30, 23:15. Между 22:50 и 23:15 отметок нет."],["d","Назначение второй палате","Калий назначен пациенту второй палаты. Введён в 22:55, подпись Норы Тер."],["e","Проверка второй палаты","Пациент второй палаты получил калий в 22:55 из другой ампулы. Значит, ампула Аси не использована."],["u","Пустая ампула","Ампула из-под калия найдена в мусоре поста. Не в мусоре второй палаты."],["p","Нора Тер, повторно","«Я вводила калий из своей ампулы, выданной в 22:40. Ампулу Аси не брала»."],["d","Журнал выдачи Норы","Калий выдан Норе в 22:40. Отдельная ампула, отдельная подпись."],["p","Ася Медь, повторно","«Я отнесла калий Норе. Она расписалась... нет, я сама списала. Я оговорилась»."],["u","Пакет физраствора","В мусоре поста — пустый пакет физраствора с проколом. Кто-то вылил его и заменил калием."],["e","Экспертиза пакета физраствора","Прокол свежий, игла та же, что использовалась для подключения калия."],["d","Дело о врачебной ошибке","Год назад Ася ввела не тот препарат, пациент выжил. Главврач скрыл дело за то, что она работала без оплаты сверхурочных."],["u","Расписка главврача","«Ты работаешь бесплатно, я молчу». Подпись Гора. Найдена в шкафчике Аси."],["d","Заявление главврача","Главврач готовил заявление в прокуратуру о той ошибке — срок давности истекал, он решил перестраховаться."],["p","Марк Санит, повторно","«В 23:05 видел Асю выходящей из шестой палаты. Она сказала — проверяла капельницу»."],["m","Расстояние","От поста до шестой палаты — минута. Пятнадцати минут хватает."],["u","Перчатка со следом калия","В мусоре поста — перчатка со следом калия. Размер S, Ася носит S."],["p","Стас Амп, повторно","«Я путаю ампулы, но калий не трогал. Ася сама всё делала. Я был на посту»."],["d","Журнал обращений","Нора получала пациентов в 22:40 и 23:20 в другом крыле. Между ними — свободна, но крыло далеко."],["e","Сопоставление игл","Игла на пакете физраствора и на капельнице — одна. Работа одного человека."],["u","Записка Аси","«Он подаст заявление. Тогда меня лишат диплома. Он не подаст»."]],"q":[["Кто подменил раствор?",[2,5,0,4,1,3],2],["Как?",["Яд в таблетках","Инъекция в вену напрямую","Удушение","Отключение аппарата","Калий вместо физраствора в капельнице"],4],["Где?",[1,0,2,4,3,5],1],["Мотив?",["Кража препаратов","Спор о назначениях","Главврач готовил заявление о её старой ошибке","Долг санитара","Месть за бесплатную работу"],2],["Почему списание калия не оправдывает сестру?",["Фармацевт соврала","Журнал подделан","Калий не назначали","Ампула не найдена","Пациент второй палаты получил калий из другой ампулы"],4]],"sol":"Ася Медь списала калий в 22:50 под своей подписью, но пациент второй палаты получил препарат из ампулы Норы — значит, ампула Аси осталась. Она вылила физраствор из пакета, наполнила калием и подключила главврачу около 23:10, пока отсутствовала на посту пятнадцать минут. Мотив — главврач готовил заявление о её старой ошибке.","ch":["Смерть от калия в капельнице, физраствор вылит (карты 1, 2, 3, 19, 20, 28).","Калий списан Асей, но второй палате введён из ампулы Норы — ампула Аси не использована (карты 4, 5, 8, 13, 14, 16, 17).","Ася оговорилась, что Нора расписалась за её калий; пустая ампула и пакет в мусоре поста, перчатка S (карты 15, 18, 19, 26).","Отметок на посту с 22:50 до 23:15 нет, Стас и Марк видели её уход и выход из шестой (карты 11, 12, 24, 25).","Нора в другом крыле с обращениями, Хирург ушёл в 20:00 (карты 7, 10, 27).","Расписка о бесплатной работе, заявление главврача и записка дают мотив (карты 21, 22, 23, 29)."]},{"k":"exped","t":"Примус в палатке","d":2,"lim":9,"v":["Гордей Нач","начальник экспедиции"],"in":"Начальник экспедиции мёртв в палатке. Угар. Полог закрыт изнутри — но застёжка снаружи тоже зафиксирована. Примус горел всю ночь, хотя его тушили в 22:00.","s":[["Лев Метео","метеоролог","Ведёт наблюдения. Начальник присвоил его данные."],["Оля Гео","геолог","Собирает образцы. Спала в соседней палатке."],["Марк Рад","радист","Передаёт сводки. Был в радиопалатке."],["Соня Повар","повар","Готовит на всех. Тушила примус в 22:00."],["Стас Пров","проводник","Знает маршрут. Спал в крайней палатке."],["Нора Врач","врач","Дежурила. Осматривала всех в 21:00."]],"pl":["Палатка начальника","Радиопалатка","Кухня-палатка","Палатка метеоролога","Склад","Костровая"],"c":[["e","Заключение врача","Смерть от отравления угарным газом, между 23:00 и 00:00."],["m","Палатка начальника","Полог застёгнут изнутри и снаружи. Вентиляционное окно заклеено изнутри лентой."],["u","Лента на окне","Лента наклеена изнутри, но край прижат снаружи — кто-то держал окно закрытым, пока клеили."],["e","Экспертиза ленты","На клейкой стороне — след перчатки с латексом. Метеоролог работает в латексных перчатках."],["u","Примус","Горел всю ночь. Топливо — керосин, бак полон. Кто-то заправил его после 22:00."],["p","Соня Повар","«Тушила примус в 22:00 и унесла бак на склад. Он был пустой»."],["d","Складской журнал","Керосин выдан в 22:40 под подпись «Л. Метео». Объём — два литра."],["e","Почерк подписи","Подпись подлинная, Льва Метео. Он не отрицает выдачу."],["p","Лев Метео","«Брал керосин для своего примуса. В палатку начальника не заходил с 21:00»."],["p","Оля Гео","«Спала с 22:30. Слышала, как кто-то ходил около 23:00, но не выглянула»."],["p","Марк Рад","«Передавал сводки с 22:00 до 00:00. Сеансы записаны»."],["p","Стас Пров","«Спал в крайней палатке. Проснулся в 23:30 от кашля — думал, начальник курит»."],["p","Нора Врач","«Осматривала всех в 21:00. Начальник был здоров. Ушла в свою палатку в 21:30»."],["d","Журнал сеансов связи","Марк передавал в 22:00, 23:00 и 00:00. Между сеансами свободен, но радиопалатка в двадцати метрах."],["d","Данные наблюдений","Метеоданные за месяц опубликованы под именем начальника. Соавтор не указан."],["u","Оригинал журнала Метео","В его палатке — оригинал журнала наблюдений с его подписями и датами."],["p","Лев Метео, повторно","«Я не заходил к начальнику. Керосин брал для себя»."],["u","Пустой бак в палатке Метео","Его примус сухой и холодный. Керосин не использован."],["e","Сопоставление керосина","Керосин в примусе начальника — из партии, выданной Метео в 22:40."],["p","Оля Гео, повторно","«В 23:00 видела силуэт у палатки начальника. Человек держал полог снаружи. Я подумала — ветер»."],["m","Расстояние","От палатки Метео до палатки начальника — десять метров. От радиопалатки — двадцать."],["u","Латексная перчатка","В мусоре палатки Метео — перчатка со следом клея ленты."],["e","Экспертиза перчатки","Клей совпадает с лентой на окне. Перчатка латексная, размер M — Метео носит M."],["p","Марк Рад, повторно","«В 22:50 видел Метео у склада с канистрой. Он сказал — для примуса»."],["p","Соня Повар, повторно","«Я тушила примус начальника и унесла бак. Он был пустой. Кто-то заправил снова»."],["d","Письмо начальника","«Данные я опубликую под своим именем. Ты получишь благодарность в приказе»."],["u","Копия письма у Метео","В его палатке — копия с пометкой «Год работы — и благодарность»."],["e","Расчёт угара","При заклеенном окне и горящем примусе смертельная концентрация наступает за час."],["p","Нора Врач, повторно","«В 23:40 начальник не ответил на оклик. Я подумала — спит. Утром нашла мёртвым»."],["u","Записка Метео","«Он не опубликует. Сегодня он уснёт навсегда»."],["u","Лента в мусоре","Рулон той же ленты в палатке Метео. Край отрезан неровно — совпадает с окном."]],"q":[["Кто заклеил окно и заправил примус?",[4,1,5,0,2,3],3],["Как было совершено убийство?",["Удушение","Удар","Яд в еде","Угар от примуса при заклеенной вентиляции","Обморожение"],3],["Где?",[4,5,0,2,3,1],2],["Мотив?",["Спор о маршруте","Начальник присвоил его метеоданные","Долг радиста","Месть повара","Кража образцов"],1],["Что доказывает, что полог держали снаружи?",["Полог был заперт на замок","Начальник держал сам","Край ленты прижат снаружи, Оля видела силуэт","Ветер прижал полог","Лента старая"],2]],"sol":"Лев Метео взял два литра керосина в 22:40, заправил примус начальника, который Соня потушила и опустошила в 22:00, и заклеил вентиляционное окно изнутри, придерживая полог снаружи. Смертельная концентрация угара наступила за час. Мотив — начальник опубликовал его данные под своим именем.","ch":["Смерть от угара, окно заклеено, примус горел всю ночь (карты 1, 2, 27).","Соня опустошила бак в 22:00; керосин выдан Метео в 22:40, тот же состав в примусе (карты 5, 6, 7, 8, 18, 19, 24).","Примус Метео сухой — керосин ушёл не к нему (карта 17).","Лента с латексом, перчатка M со следом клея и рулон в его палатке; Оля видела силуэт, держащий полог (карты 3, 4, 20, 21, 22, 30).","Марк видел его у склада с канистрой; расстояние десять метров (карты 21, 23).","Оригинал журнала, письмо начальника и записка дают мотив (карты 15, 16, 25, 26, 28)."]},{"k":"auction","t":"Молоток для лота 17","d":2,"lim":9,"v":["Гордей Аукц","аукционист"],"in":"Аукционист мёртв в зале после торгов. Удар молотком. Лот 17 ушёл за 30 миллионов, но экспертиза показала подделку. Страховка оформлена за день до аукциона.","s":[["Марк Страхов","страховщик","Оформил полис на лот за день. Выгодоприобретатель — его фирма."],["Оля Лот","эксперт","Дала заключение о подлинности. потом сомневалась."],["Лев Молот","помощник аукциониста","Подавал молоток. Был на подиуме."],["Нина Зал","администратор","Регистрировала покупателей."],["Стас Кат","каталогизатор","Составлял каталог. Знал про подделку."],["Ира Рама","реставратор","Оформляла лот. Ушла до торгов."]],"pl":["Зал аукциона","Подиум","Комната экспертизы","Склад лотов","Кабинет страховщика","Фойе"],"c":[["e","Заключение врача","Смерть от удара аукционным молотком, около 21:40. Один удар."],["m","Зал аукциона","Кровь у подиума. Молоток лежит рядом, кровь на бойке."],["u","Молоток","Отпечатки стёрты. Но на рукояти — след страхового воска."],["e","Экспертиза воска","Воск — из печати страховой фирмы. Такой воск есть только у страховщика."],["d","Страховой полис","Лот 17 застрахован на 30 млн за день до аукциона. Выгодоприобретатель — фирма Марка."],["e","Экспертиза лота 17","Лот — подделка XIX века. Реальная стоимость — 200 тысяч."],["p","Оля Лот","«Дала заключение о подлинности, но потом сомневалась. Сказала аукционисту перед торгами»."],["p","Марк Страхов","«Был в фойе с 21:00 до 22:00. Регистрировал полисы. Нина меня видела»."],["p","Лев Молот","«Подавал молоток до 21:30, потом ушёл на склад за следующим лотом. Вернулся в 21:50»."],["p","Нина Зал","«Марк был в фойе, но выходил минут на двадцать около 21:30. Сказал — звонить»."],["p","Стас Кат","«Составлял каталог в комнате экспертизы. Знал, что лот сомнительный»."],["p","Ира Рама","«Ушла в 20:30 после оформления. Пропуск подтвердит»."],["d","Журнал пропусков","Ира вышла в 20:33. Остальные внутри до 22:30."],["p","Оля Лот, повторно","«Аукционист сказал, что снимет лот с торгов и сообщит в страховую. Марк был в ярости»."],["d","Письмо аукциониста","«Лот 17 — подделка. Снимаю с торгов, уведомляю страховую и полицию». Черновик найден в его папке."],["u","Копия письма у Марка","В кабинете страховщика — копия письма с пометкой «Он уведомит. Тогда выплата сгорит»."],["m","Расстояние","От фойе до зала — две минуты. Двадцати минут хватает."],["u","Печать страховой фирмы","В кабинете Марка — печать с воском того же состава. Воск свежий."],["e","Сопоставление воска","Воск на молотке и на печати — одна партия. Совпадение по примесям."],["p","Нина Зал, повторно","«В 21:35 видела Марка выходящим из зала. Он вытирал руки платком»."],["u","Платок со кровью","В мусоре кабинета страховщика — платок со следами крови жертвы."],["d","Условия выплаты","При признании лота подделкой до выплаты страховая не платит. После выплаты — деньги остаются у фирмы."],["p","Лев Молот, повторно","«Я ушёл на склад в 21:30. Молоток оставил на подиуме. Вернулся — аукционист мёртв»."],["d","Складской журнал","Следующий лот выдан Льву в 21:32. Он был на складе до 21:50."],["p","Стас Кат, повторно","«Я говорил аукционисту про подделку. Он решил снять лот. Марк слышал этот разговор»."],["u","Запись разговора","В комнате экспертизы диктофон Стаса писал. На записи — голос Марка: «Ты не снимешь»."],["e","Экспертиза записи","Голос Марка подтверждён. Запись сделана в 21:20."],["p","Марк Страхов, повторно","«Я не заходил в зал. Нина путает время»."],["u","Перчатка со следом воска","В кабинете Марка — перчатка со следом воска и крови."],["u","Записка Марка","«Тридцать миллионов или срок. Он выбрал срок для меня»."]],"q":[["Кто ударил молотком?",[3,4,2,1,0,5],4],["Чем?",["Рама","Аукционный молоток","Подсвечник","Трость","Каталог"],1],["Где?",[4,3,1,2,0,5],4],["Мотив?",["Аукционист снимал поддельный лот и уведомлял страховую — выплата сгорала","Долг помощника","Месть эксперта","Спор о каталоге","Кража лота"],0],["Что связало молоток со страховщиком?",["Кровь на платке","Слова Нины","Отпечатки","Запись диктофона","Страховой воск на рукояти и его печать"],4]],"sol":"Марк Страхов вышел из фойе около 21:30, ударил аукциониста молотком в зале и вытер руки платком. Страховой воск на рукояти совпадает с печатью его фирмы, платок и перчатка с кровью — в его кабинете. Мотив — аукционист снимал поддельный лот и уведомлял страховую, из-за чего выплата в 30 млн сгорала.","ch":["Удар молотком, страховой воск на рукояти совпадает с печатью фирмы (карты 1, 2, 3, 4, 18, 19).","Лот — подделка, аукционист готовил снятие и уведомление; при этом выплата не идёт (карты 6, 14, 15, 22).","Марк заявляет фойе, но Нина даёт двадцатиминутный уход и видела его выходящим из зала (карты 8, 10, 20).","Платок и перчатка с кровью и воском в его кабинете (карты 21, 29).","Диктофон записал его угрозу в 21:20 (карты 25, 26, 27).","Лев был на складе по журналу, Ира ушла, копия письма у Марка даёт мотив (карты 9, 12, 13, 16, 23, 24, 30)."]},{"k":"radio","t":"Тишина в эфире","d":3,"lim":8,"v":["Гордей Голос","ведущий"],"in":"Ведущий мёртв в студии. Удушение кабелем. Эфир шёл в прямом режиме — но запись показывает, что в 23:15 в студии была тишина восемь секунд, хотя ведущий должен был говорить.","s":[["Лев Звук","звукорежиссёр","Сидит за пультом. Ведущий присвоил его сценарий."],["Оля Эфир","редактор","Готовит тексты. Была в редакторской."],["Марк Микро","техник","Меняет микрофоны. Был в аппаратной."],["Нина Джингл","музыкальный редактор","Ставит отбивки. Ушла в 22:00."],["Стас Антен","инженер эфира","Следит за передатчиком."],["Ира Гость","продюсер гостей","Ушла после записи гостя в 22:30."]],"pl":["Студия","Пульт звукорежиссёра","Аппаратная","Редакторская","Передатчик","Фойе"],"c":[["e","Заключение врача","Смерть от асфиксии, удавка кабелем, около 23:15."],["m","Студия","Кабель на шее жертвы. Микрофон включён, эфир шёл."],["u","Кабель","Микрофонный кабель с обрезанным концом. Обрез свежий, сделан кусачками."],["e","Экспертиза кабеля","Обрез совпадает с кабелем из аппаратной. Партия редкая, для студийного монтажа."],["d","Запись эфира","В 23:15:04 — восемь секунд тишины, затем кашель и музыкальная отбивка."],["e","Разбор записи","Отбивка запущена вручную с пульта звукорежиссёра, не по автоматике."],["p","Лев Звук","«Сидел за пультом весь эфир. Отбивку поставил автоматом, как всегда»."],["d","Журнал пульта","Отбивка в 23:15:12 запущена вручную. Автоматика в это время отключена."],["e","Проверка автоматики","Автоматику отключили в 23:10 с пульта. Ключ-карта — Льва Звука."],["p","Оля Эфир","«Была в редакторской с 22:40 до 23:40. Готовила утренний текст»."],["p","Марк Микро","«Менял микрофон в аппаратной с 23:00 до 23:30. Один»."],["p","Нина Джингл","«Ушла в 22:00. Пропуск подтвердит»."],["p","Стас Антен","«Был у передатчика. Параметры пишутся непрерывно, я не отходил»."],["p","Ира Гость","«Ушла в 22:30 после записи. Пропуск подтвердит»."],["d","Журнал пропусков","Нина вышла в 22:02, Ира в 22:33. Остальные внутри до 00:00."],["d","Журнал передатчика","Параметры стабильны, вмешательств нет. Стас не отходил."],["u","Кусачки","В ящике пульта — кусачки со следами меди того же кабеля."],["e","Экспертиза кусачек","Медь на кусачках совпадает с кабелем. Кусачки закреплены за звукорежиссёром."],["m","Расстояние","От пульта до студии — три шага через стекло и дверь. Пять секунд."],["p","Оля Эфир, повторно","«В 23:15 я слышала тишину в мониторe. Потом отбивка. Подумала — ведущий подавился»."],["d","Сценарий эфира","Сценарий написан Львом, но в эфире звучит под именем ведущего. Оригинал с его подписью."],["u","Оригинал сценария","В ящике пульта — оригинал с подписью Льва и датой на месяц раньше."],["p","Лев Звук, повторно","«Сценарий мой, но я подарил его. Не убивал же я за подарок»."],["d","Письмо ведущего","«Сценарий я забираю. Ты получишь строчку в титрах». Отправлено за день."],["u","Копия письма у Льва","В его ящике — копия с пометкой «Подарил? Он украл»."],["p","Марк Микро, повторно","«В 23:12 видел Льва выходящим из-за пульта в студию. Вернулся в 23:16»."],["e","Запись камеры фойе","Камера пишет коридор: Лев входит в студию в 23:12, выходит в 23:16."],["p","Лев Звук, трижды","«Я не выходил. Марк и камера ошибаются»."],["u","Перчатка со следом меди","В ящике пульта — перчатка со следом меди кабеля и пота ведущего."],["u","Записка Льва","«Он не отдаст сценарий. В эфире будет тишина — и она будет его»."]],"q":[["Кто задушил ведущего?",[3,0,1,4,2,5],1],["Чем?",["Микрофонный кабель","Провод антенны","Шарф","Ремень","Шнур питания"],0],["Где?",[4,3,2,1,0,5],4],["Мотив?",["Спор об отбивках","Долг техника","Кража музыки","Месть редактора","Ведущий присвоил его сценарий"],4],["Что выдало восемь секунд тишины?",["Гость ушёл","Микрофон отключился","Сбой передатчика","Ведущий подавился","Отбивка запущена вручную, автоматика отключена его картой"],4]],"sol":"Лев Звук отключил автоматику отбивок своей картой в 23:10, обрезал кабель кусачками с пульта, вошёл в студию в 23:12 и задушил ведущего. Восемь секунд тишины в прямом эфире он прикрыл ручной отбивкой в 23:15:12. Камера и техник фиксируют его вход и выход, кусачки и перчатка — в его ящике. Мотив — присвоенный сценарий.","ch":["Удушение кабелем из студийной партии, обрез его кусачками (карты 1, 2, 3, 4, 17, 18).","Восемь секунд тишины, отбивка вручную, автоматика отключена его картой в 23:10 (карты 5, 6, 8, 9).","Лев заявляет, что не выходил, но Марк и камера фиксируют вход в 23:12 и выход в 23:16 (карты 7, 26, 27, 28).","Перчатка со следом меди и пота ведущего в его ящике (карта 29).","Оригинал сценария с его подписью, письмо ведущего и записка дают мотив (карты 21, 22, 24, 25, 30).","Нина и Ира ушли, Стас у передатчика по журналу, Оля в редакторской (карты 10, 12, 13, 14, 15, 16, 20)."]}];

if(!p||typeof p!=='object')p={};p.done=p.done||{};p.best=p.best||{};return p;}

function save(){if(!A.G||A.net==='guest')return;LS.s('el_save',JSON.stringify({g:A.G,mode:A.mode}));}

function newGame(cid,players){
var cs=CASES[cid],order=[];for(var i=0;i<cs.n;i++)order.push(i);shuf(order);
var hands={},pl2=players.map(function(p){return{id:p.id,name:p.name};});
pl2.forEach(function(p){hands[p.id]=order.splice(0,3);});
return{cid:cid,pl:pl2,hands:hands,deck:order,table:[],disc:[],turn:pl2[0].id,ti:0,
ph:'brief',last:null,qi:0,ans:[],votes:{},flash:null,pend:null,res:null,notes:'',v:0};}
function nextTurn(){var g=A.G,n=g.pl.length;
for(var k=1;k<=n;k++){var i=(g.ti+k)%n;if((g.hands[g.pl[i].id]||[]).length){g.ti=i;g.turn=g.pl[i].id;return;}}
g.ti=0;g.turn=g.pl[0].id;}
function drawTo(id){var g=A.G,h=g.hands[id]||[];while(h.length<3&&g.deck.length)h.push(g.deck.shift());g.hands[id]=h;}
function allDone(){return A.G.deck.length===0&&A.G.pl.every(function(p){return (A.G.hands[p.id]||[]).length===0;});}
function perform(op,a){
if(A.net==='guest'){if(NET.conn&&NET.conn.open){try{NET.conn.send({t:'do',op:op,a:a||{}});}catch(e){toast('Нет связи с хостом','bad');}}else toast('Нет связи с хостом','bad');return;}
apply(op,a||{},A.me);if(A.net==='host')bcast();save();render();}
function apply(op,a,pid){
var g=A.G;if(!g)return;
if(op==='notes'){if(!g.pl.some(function(p){return p.id===pid;}))return;g.notes=String(a.v||'').slice(0,4000);return;}
if(g.res)return;
if(op==='begin'){if(g.ph!=='brief')return;if(A.net==='host'&&pid!=='p0')return;g.ph='play';sfx('deal');return;}
if(op==='ready'){if(g.ph!=='priv')return;if(A.net==null&&A.mode==='team')A.me=g.turn;else if(g.turn!==pid)return;g.ph='play';return;}
if(op==='open'||op==='disc'){
if(g.ph!=='play'||g.turn!==pid)return;
var h=g.hands[pid]||[],ix=h.indexOf(a.i);if(ix<0)return;
h.splice(ix,1);
if(op==='open'){g.table.push(a.i);g.last={t:'open',i:a.i,by:pid};sfx('open');vib(14);}
else{g.disc.push(a.i);g.last={t:'disc',by:pid};sfx('drop');vib(28);
if(g.disc.length>CS().lim){finish(true);return;}}
drawTo(pid);
if(allDone()){g.ph='fin';g.last=null;}
else{nextTurn();if(A.mode==='team'&&g.pl.length>1)g.ph='priv';else g.ph='play';}
return;}
if(op==='go'){if(g.ph!=='fin')return;g.ph='quiz';g.qi=0;g.ans=[];g.votes={};return;}
if(op==='pick'){if(g.ph!=='quiz'||g.flash||!Number.isInteger(a.i)||!CS().q[g.qi]||a.i<0||a.i>=CS().q[g.qi][1].length)return;
g.pend=a.i;g.flash=a.i;sfx('stamp');later('fl',function(){if(A.G&&A.G.ph==='quiz')commit(A.G.pend);},1000);return;}
if(op==='vote'){if(g.ph!=='quiz'||g.flash||!g.pl.some(function(p){return p.id===pid;})||!Number.isInteger(a.i)||!CS().q[g.qi]||a.i<0||a.i>=CS().q[g.qi][1].length)return;g.votes[pid]=a.i;
var need=g.pl.length;if(Object.keys(g.votes).length>=need)lock();return;}
if(op==='lock'){if(g.ph!=='quiz'||g.flash)return;if(A.net==='host'&&pid!=='p0')return;if(!Object.keys(g.votes).length)return;lock();return;}
if(op==='reveal'){if(g.ph!=='env')return;finish(false);return;}
}
function lock(){var g=A.G,cnt={},ks=Object.keys(g.votes);
ks.forEach(function(k){var o=g.votes[k];cnt[o]=(cnt[o]||0)+1;});
var best=-1,tie=[];Object.keys(cnt).forEach(function(k){var c=cnt[k];if(c>best){best=c;tie=[+k];}else if(c===best)tie.push(+k);});
var ch=tie[0],hv=g.votes['p0'];if(tie.length>1&&hv!=null&&tie.indexOf(hv)>=0)ch=hv;
g.pend=ch;g.flash=ch;sfx('stamp');later('fl',function(){if(A.G&&A.G.ph==='quiz')commit(A.G.pend);},1000);}
function commit(ch){var g=A.G;if(!g||g.ph!=='quiz'||!Number.isInteger(ch))return;var q=CS().q[g.qi];if(!q||ch<0||ch>=q[1].length)return;
g.ans.push({q:q[0],ch:ch,ok:ch===q[2]});g.votes={};g.flash=null;g.pend=null;g.qi++;
if(g.qi>=CS().q.length)g.ph='env';
if(A.net==='host')bcast();save();render();}
function finish(over){var g=A.G,cs=CS(),sc=0;
if(!over){g.ans.forEach(function(a){if(a.ok)sc++;});}
var tot=cs.q.length,verd;
if(over)verd={t:'Расследование провалено',c:'#d6414d',k:'ПРОВАЛ',d:'Сброшено '+g.disc.length+' '+pl(g.disc.length,['карта','карты','карт'])+' при лимите '+cs.lim+'. Улики уничтожены — дело развалилось, не дойдя до вопросов.'};
else if(sc===tot)verd={t:'Идеальное раскрытие',c:'#5cbf78',k:'ПРИГОВОР',d:'Все ответы верны. Дело закрыто безупречно — ни одной ошибки в протоколе.'};
else if(sc===tot-1)verd={t:'Убедительная победа',c:'#84c94b',k:'ДЕЛО ЗАКРЫТО',d:'Одна деталь ускользнула, но суть схвачена. Виновный не уйдёт.'};
else if(sc/tot>=.6)verd={t:'Частичный успех',c:'#e0a33c',k:'ЧАСТИЧНО',d:'Картина сложилась не вся. Достаточно для обвинения — но осадок остался.'};
else verd={t:'Версия не выдержала проверки',c:'#d6414d',k:'ПРОВАЛ',d:'Истина была рядом — и всё же ускользнула. Разбор ниже покажет, где вы свернули.'};
g.res={sc:sc,tot:tot,over:over,v:verd};g.ph='res';
var p=prog();if(!over){p.done[g.cid]=true;p.best[g.cid]=Math.max(p.best[g.cid]||0,sc);}saveProg(p);
clearSave();sfx('stamp');vib([40,60,40]);
setTimeout(function(){if(over||sc/tot<.6){sfx('lose');rain(['#6a7484','#d6414d','#3c4c64'],60);}
else{sfx(sc===tot?'win':'half');rain(sc===tot?['#5cbf78','#e0a33c','#ece5d4','#f6ca6c']:['#e0a33c','#84c94b','#ece5d4'],sc===tot?110:60);}},450);}

var h=bar(false)+'<div class="v"><div class="hero">'+logo(76)+'<h1>ЭЛЕМЕНТАРНО</h1><div class="sb">Двадцать дел · карточный детектив</div>'

pe.on('error',function(er){var t=er&&er.type;
if(t==='unavailable-id'){try{pe.destroy();}catch(e){}if(at<4)hostCreate(at+1);else netErr('Не удалось подобрать свободный код.');}
else if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){
if(!NET.code)netErr(peerErrText(er));
else toast('Проблема с сигнальным сервером — подключённые продолжают игру.','warn');}
else if(t==='webrtc'||t==='browser-incompatible'||t==='ssl-unavailable')toast(peerErrText(er),'warn');});});}
function hostData(c,m){if(!m||typeof m!=='object')return;
if(m.t==='join'){if(A.G){try{c.send({t:'started'});}catch(e){}return;}
if(NET.pl.length>=5){try{c.send({t:'full'});}catch(e){}return;}
var pid='p'+(NET.seq++),nm=String(m.name||'Следователь').slice(0,18);
NET.pl.push({id:pid,name:nm});NET.conns[pid]=c;c.__pid=pid;
try{c.send({t:'wl',pid:pid,l:{cid:A.caseId,pl:NET.pl}});}catch(e){}
toast(nm+' подключился(а).','ok');sfx('join');A.sc='lobby';bcastLobby();render();}
else if(m.t==='rejoin'){var p=null;NET.pl.forEach(function(x){if(x.id===m.pid)p=x;});
if(!p){try{c.send({t:'started'});}catch(e){}return;}
var old=NET.conns[p.id];if(old&&old!==c){try{old.close();}catch(e){}}
NET.conns[p.id]=c;c.__pid=p.id;
try{c.send({t:'wl',pid:p.id,l:A.G?null:{cid:A.caseId,pl:NET.pl},v:A.G?viewFor(p.id):null});}catch(e){}
toast(p.name+' снова в сети.','ok');bcast();render();}
else if(m.t==='do'){if(c.__pid){apply(m.op,m.a||{},c.__pid);bcast();save();render();}}
else if(m.t==='bye')hostClosed(c);}
function hostClosed(c){var pid=c.__pid;if(!pid||NET.conns[pid]!==pid&&NET.conns[pid]!==c)return;
if(NET.conns[pid]!==c)return;delete NET.conns[pid];
var p=null;NET.pl.forEach(function(x){if(x.id===pid)p=x;});if(!p)return;
if(!A.G){NET.pl=NET.pl.filter(function(x){return x.id!==pid;});toast(p.name+' покинул(а) комнату.','warn');bcastLobby();render();return;}
toast(p.name+' потерял(а) связь. Хост может играть за него.','warn');
if(A.G.turn===pid){later('skip',function(){if(A.G&&A.G.turn===pid&&A.G.ph==='play'){toast('Ход '+p.name+' пропущен.','warn');nextTurn();if(A.G.ph==='play')A.G.ph='priv';bcast();render();}},20000);}
render();}
function joinRoom(code,nm,re,silent){code=String(code||'').replace(/\D/g,'').slice(0,6);
if(!/^\d{6}$/.test(code)){toast('Введите шестизначный код комнаты.','warn');return;}
nm=(nm||'').trim()||'Следователь';LS.s('el_nm',nm);
if(!silent){killNet();A.sc='conn';A.connMsg='Подключаемся к сигнальному серверу…';render();}
A.net='guest';A.joinCode=code;A.joinName=nm;NET.code=code;
need('p',PU,'Peer',function(ok){if(A.net!=='guest')return;
if(!ok){netErr('Не загрузилась библиотека PeerJS с unpkg.com. Проверьте доступ к CDN.');return;}
var peerReady=false,channelOpen=false,welcomed=false;
function connectToHost(){
if(peerReady||A.net!=='guest'||!NET.peer||!NET.peer.open)return;
peerReady=true;stop('jw');
if(!silent){A.connMsg='Сигнальный сервер доступен. Ищем комнату '+code+'…';render();}
var c;try{c=NET.peer.connect('el20-'+code,{reliable:true});}
catch(e){netErr('Не удалось создать канал WebRTC: '+(e&&e.message?e.message:'неизвестная ошибка'));return;}
NET.conn=c;
later('jw',function(){if(welcomed||A.net!=='guest')return;
if(channelOpen)netErr('Канал WebRTC открыт, но хост не прислал ответ. Проверьте, что на первом устройстве открыто лобби этой комнаты.');
else netErr('PeerJS доступен, но WebRTC-канал не открылся за 30 секунд. Возможна блокировка WebRTC/UDP или STUN/TURN в сети либо браузере.');},30000);
c.on('open',function(){channelOpen=true;
if(!silent){A.connMsg='Канал открыт. Ждём ответа хоста…';render();}
try{c.send(re?{t:'rejoin',pid:re,name:nm}:{t:'join',name:nm});}
catch(e){netErr('Канал открыт, но запрос хосту не отправлен: '+(e&&e.message?e.message:'ошибка отправки'));}});
c.on('data',function(m){if(m&&m.t==='wl'){welcomed=true;stop('jw');}guestData(m);});
c.on('close',function(){if(A.net==='guest'&&(A.G||A.sc==='lobby'))enterLost();else if(A.net==='guest')netErr('WebRTC-канал закрылся до ответа хоста.');});
c.on('error',function(er){if(A.net==='guest'&&(A.G||A.sc==='lobby'))enterLost();else if(A.net==='guest')netErr('Ошибка WebRTC: '+(er&&er.message?er.message:'неизвестная ошибка'));});
}
if(!NET.peer||NET.peer.destroyed){var pe;try{pe=new Peer(peerOptions());}catch(e){netErr('Не удалось создать PeerJS-узел: '+(e&&e.message?e.message:'ошибка'));return;}
NET.peer=pe;pe.on('open',connectToHost);pe.on('disconnected',function(){if(A.net==='guest'){try{pe.reconnect();}catch(e){}}});
pe.on('error',function(er){var t=er&&er.type;
if(t==='peer-unavailable'&&A.sc!=='lobby'&&!A.G)netErr('Комната '+code+' не найдена. Проверьте код и что хост оставил лобби открытым.');
else if(A.sc!=='lobby'&&!A.G&&['network','server-error','socket-error','socket-closed','webrtc','browser-incompatible','ssl-unavailable'].indexOf(t)>=0)netErr(peerErrText(er));});
later('jw',function(){if(!peerReady&&A.net==='guest')netErr('Не удалось подключиться к PeerJS Cloud (0.peerjs.com:443). Проверьте доступ к сигнальному серверу и CDN unpkg.com.');},20000);
}else if(NET.peer.open)connectToHost();else NET.peer.once('open',connectToHost);
if(!NET.wt)NET.wt=setInterval(function(){if(A.net==='guest'&&(A.G||A.sc==='lobby')&&!A.lost&&Date.now()-NET.last>12000)enterLost();},3000);
});}
function guestData(m){if(!m||typeof m!=='object')return;NET.last=Date.now();
if(A.lost&&(m.t==='wl'||m.t==='l'||m.t==='g'||m.t==='hb')){A.lost=false;A.retries=0;renderLost();toast('Связь восстановлена.','ok');}
if(m.t==='wl'){A.me=m.pid;A.retries=0;SS.s({code:NET.code,pid:m.pid,name:A.joinName});
if(m.l){A.caseId=m.l.cid;NET.pl=m.l.pl;A.G=null;A.sc='lobby';}
if(m.v){A.G=fromView(m.v,m.pid);A.sc='game';}
sfx('join');render();}
else if(m.t==='l'){A.caseId=m.l.cid;NET.pl=m.l.pl;A.G=null;A.sc='lobby';render();}
else if(m.t==='g'){var pid=A.me;A.G=fromView(m.v,pid);A.sc='game';render();}
else if(m.t==='closed')netErr('Хост закрыл комнату.');
else if(m.t==='kicked')netErr('Хост исключил вас из комнаты.');
else if(m.t==='full')netErr('Комната заполнена: максимум 5 следователей.');
else if(m.t==='started')netErr('Дело уже идёт. Дождитесь нового дела и войдите снова.');}
function enterLost(){if(A.lost||A.net!=='guest')return;A.lost=true;renderLost();sfx('err');vib(40);
var at=function(){if(!A.lost||A.net!=='guest')return;A.retries++;
try{if(NET.conn)NET.conn.close();}catch(e){}NET.conn=null;joinRoom(NET.code,A.joinName,A.me,true);
if(A.retries<3)later('recon',at,A.retries===1?5000:9000);};later('recon',at,1500);}
function renderLost(){var e=$('#lost');if(!e)return;
if(!A.lost){e.className='';e.innerHTML='';return;}
e.className='on';e.innerHTML='<div class="lb"><div class="spin"></div><h2 style="font-size:21px">Связь с хостом потеряна</h2>'
+'<p class="mu">'+(A.retries<3?'Переподключаемся… попытка '+Math.max(1,A.retries+1)+' из 3.':'Автопопытки исчерпаны. Проверьте Wi-Fi.')+'</p>'
+'<button class="btn bc" data-a="retry">'+ic('wifi',18)+'Переподключиться</button>'
+'<button class="btn bg2" data-a="menu">'+ic('home',18)+'В меню</button></div>';}
function initQR(){var e=$('#qr');if(!e)return;
e.innerHTML='<div style="width:164px;height:164px;display:flex;align-items:center;justify-content:center;color:#5c5138;font:11px var(--mono);text-align:center">Готовим QR…</div>';
var u=invURL();need('q',QU,'QRCode',function(ok){var b=$('#qr');if(!b)return;b.innerHTML='';
if(ok){try{new window.QRCode(b,{text:u,width:164,height:164,colorDark:'#131a24',colorLight:'#f1e8d3',correctLevel:window.QRCode.CorrectLevel.M});return;}catch(x){}}
b.innerHTML='<div style="width:164px;height:164px;display:flex;align-items:center;justify-content:center;text-align:center;color:#5c5138;font:11px var(--mono);padding:10px">QR недоступен — используйте код или ссылку</div>';});}
/* ═══ СОБЫТИЯ ═══ */
function startLocal(){var pl2;
if(A.mode==='solo'){var nm=(($('#hn')&&$('#hn').value)||A.hostName||'').trim()||'Следователь';LS.s('el_nm',nm);A.hostName=nm;pl2=[{id:'p0',name:nm}];}
else{var fs=document.querySelectorAll('.pn');for(var i=0;i<fs.length;i++)A.names[+fs[i].getAttribute('data-i')]=fs[i].value;
pl2=A.names.map(function(n,j){return{id:'p'+j,name:(n||'').trim()||('Следователь '+(j+1))};});LS.s('el_nm',pl2[0].name);}
A.me='p0';A.G=newGame(A.caseId,pl2);A.sc='game';A.sel=null;A.full=null;save();render();sfx('deal');vib(18);}
document.addEventListener('click',function(e){
var b=e.target&&e.target.closest?e.target.closest('[data-a]'):null;if(!b||b.disabled)return;
var a=b.getAttribute('data-a'),id=b.getAttribute('data-id'),i=b.getAttribute('data-i');
if(a==='snd'){setSnd(!AU.on);return;}
if(a==='sheet'){A.sheet=id;sfx('tap');renderSheet();return;}
if(a==='closesheet'){A.sheet=null;renderSheet();sfx('tap');return;}
if(a==='full'){A.full=id;sfx('tap');renderFull();return;}
if(a==='closefull'){A.full=null;renderFull();sfx('tap');return;}
if(a==='ftab'){A.ftab=id;sfx('pick');renderFull();return;}
if(a==='dtab'){A.dtab=id;sfx('pick');renderFull();return;}
if(a==='menu'){stop('fl');abortNet();A.G=null;A.sheet=null;A.full=null;A.sc='menu';render();sfx('tap');return;}
if(a==='solo'||a==='team'||a==='net'){stop('fl');abortNet();A.mode=a;A.sc='cases';render();sfx('tap');return;}
if(a==='cont'){var sv=loadSave();if(!sv){toast('Сохранение не найдено.','warn');render();return;}
A.G=sv.g;A.mode=sv.mode||'solo';A.me='p0';A.caseId=A.G.cid;A.sc='game';A.sel=null;render();sfx('deal');
toast('Дело продолжено.','ok');return;}
if(a==='pickcase'||a==='goto'){A.caseId=+i;A.sheet=null;A.sc='setup';render();sfx('pick');return;}
if(a==='cases'){if(A.net==='host'){A.G=null;A.sc='cases';bcastLobby();render();}else{A.sc='cases';render();}sfx('tap');return;}
if(a==='addp'){if(A.names.length<5){A.names.push('');render();sfx('tap');}return;}
if(a==='rmp'){if(A.names.length>2){A.names.splice(+i,1);render();sfx('tap');}return;}
if(a==='start'){startLocal();return;}
if(a==='again'){A.G=newGame(A.caseId,A.G?A.G.pl:[{id:'p0',name:A.hostName||'Следователь'}]);A.me='p0';A.sc='game';A.sel=null;A.full=null;save();render();sfx('deal');return;}
if(a==='begin'){perform('begin',{});return;}
if(a==='ready'){sfx('deal');perform('ready',{});return;}
if(a==='sel'){A.sel=(A.sel===+i)?null:+i;sfx('pick');render();return;}
if(a==='open'){if(A.sel!=null){var s=A.sel;A.sel=null;perform('open',{i:s});}return;}
if(a==='disc'){if(A.sel!=null){var s2=A.sel;A.sel=null;perform('disc',{i:s2});}return;}
if(a==='go'){perform('go',{});sfx('tap');return;}
if(a==='pick'){perform('pick',{i:+i});return;}
if(a==='vote'){sfx('tick');perform('vote',{i:+i});return;}
if(a==='lock'){perform('lock',{});return;}
if(a==='reveal'){if(A.rev)return;A.rev=true;sfx('tear');vib(25);var w=$('#env');if(w)w.classList.add('op');
setTimeout(function(){A.rev=false;perform('reveal',{});},820);return;}
if(a==='hostcreate'){hostCreate();return;}
if(a==='joingo'){var jc=$('#jc'),jn=$('#jn');if(jc)A.joinCode=jc.value;if(jn)A.joinName=jn.value;joinRoom(A.joinCode,A.joinName);return;}
if(a==='cancelconn'){abortNet();A.sc='menu';render();return;}
if(a==='copycode'){copy(NET.code,'Код комнаты скопирован');return;}
if(a==='copylink'){copy(invURL(),'Ссылка-приглашение скопирована');return;}
if(a==='kick'){var c=NET.conns[id];if(c){try{c.send({t:'kicked'});}catch(x){}setTimeout(function(){try{c.close();}catch(x){}},250);delete NET.conns[id];}
NET.pl=NET.pl.filter(function(p){return p.id!==id;});bcastLobby();render();return;}
if(a==='netstart'){A.me='p0';A.G=newGame(A.caseId,NET.pl);A.sc='game';A.sel=null;bcast();save();render();sfx('deal');vib(18);return;}
if(a==='leave'){abortNet();A.sc='menu';toast('Вы покинули комнату.','info');render();return;}
if(a==='retry'){A.retries=0;stop('recon');try{if(NET.conn)NET.conn.close();}catch(x){}NET.conn=null;joinRoom(NET.code,A.joinName,A.me,true);renderLost();return;}
});
document.addEventListener('input',function(e){var t=e.target;if(!t||!t.tagName)return;
if(t.id==='jc'){t.value=t.value.replace(/\D/g,'').slice(0,6);A.joinCode=t.value;}
else if(t.id==='jn')A.joinName=t.value;
else if(t.id==='hn')A.hostName=t.value;
else if(t.id==='nt'){perform('notes',{v:t.value});}
else if(t.id==='fq'){A.fq=t.value;var p=t.selectionStart;renderFull();var n=$('#fq');if(n){n.focus();try{n.setSelectionRange(p,p);}catch(x){}}}
else if(t.className&&String(t.className).indexOf('pn')>=0)A.names[+t.getAttribute('data-i')]=t.value;});
document.addEventListener('keydown',function(e){
if(e.key==='Escape'){if(A.sheet){A.sheet=null;renderSheet();return;}if(A.full){A.full=null;renderFull();return;}}
if(e.key==='Enter'&&e.target&&e.target.id){var m={jc:'joingo',jn:'joingo',hn:'start'}[e.target.id];
if(m){var b=document.querySelector('[data-a="'+m+'"]');if(b)b.click();}}});
document.addEventListener('pointerdown',function(){auInit();if(AU.c&&AU.on){try{AU.c.resume();}catch(e){}}},{once:true});
document.addEventListener('visibilitychange',function(){if(document.hidden)return;
if(A.net==='guest'&&(A.G||A.sc==='lobby')&&Date.now()-NET.last>12000)enterLost();
if(A.net==='host')bcast();});
addEventListener('popstate',function(ev){var st=ev.state;if(!st||!st.__gameNav||!st.snapshot)return;
try{var saved=st.snapshot;Object.keys(A).forEach(function(k){delete A[k];});Object.keys(saved).forEach(function(k){A[k]=saved[k];});appNavPop=true;render();}
catch(e){appNavPop=false;}});
addEventListener('beforeunload',function(){if(A.G&&A.net!=='guest'&&!A.G.res)save();
try{if(NET.conn&&NET.conn.open)NET.conn.send({t:'bye'});}catch(e){}try{if(NET.peer)NET.peer.destroy();}catch(e){}});
/* ═══ ЗАПУСК ═══ */
fxInit();
var qs=null;try{qs=new URLSearchParams(location.search);}catch(e){}
if(qs){var rm=qs.get('room'),cc=qs.get('case');
if(cc!=null&&CASES[+cc]){A.caseId=+cc;A.mode='solo';A.sc='setup';}
if(rm){A.joinCode=rm.replace(/\D/g,'').slice(0,6);A.sc='join';
var ss=SS.g();if(ss&&ss.code===A.joinCode&&ss.pid){A.joinName=ss.name||A.joinName;
setTimeout(function(){joinRoom(A.joinCode,A.joinName,ss.pid);},450);}}}
render();
window.__ok=true;
})();
</script>
