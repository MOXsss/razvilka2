.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .sc{position:absolute;inset:0;background:rgba(2,3,6,.8);backdrop-filter:blur(6px);animation:fd .22s both}
.sheet .bx{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;max-height:88vh;background:linear-gradient(180deg,var(--raise),var(--desk) 22%);border:1px solid var(--edge2);border-bottom:none;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:su .34s cubic-bezier(.2,.8,.25,1) both}

.sheet .sh{display:flex;align-items:center;gap:10px;padding:15px 16px 12px;border-bottom:1px solid var(--edge)}
.sheet .sh h3{font-size:17px;flex:1}
.sheet .sb2{overflow-y:auto;padding:15px 16px calc(22px + env(safe-area-inset-bottom))}
.full{position:fixed;inset:0;z-index:55;background:var(--void);display:none;flex-direction:column}
.full.on{display:flex}

.full .fb{flex:1;overflow-y:auto;max-width:600px;margin:0 auto;width:100%;padding:14px 14px calc(26px + env(safe-area-inset-bottom))}

.toast.out{animation:to .3s ease forwards}
.toast i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--tc2,var(--d));margin-top:6px}
@keyframes ti{from{opacity:0;transform:translateY(-18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes to{to{opacity:0;transform:translateY(-10px) scale(.95)}}
#lost{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(2,3,6,.93);padding:22px}
#lost.on{display:flex}

#fx{position:fixed;inset:0;z-index:80;pointer-events:none}
